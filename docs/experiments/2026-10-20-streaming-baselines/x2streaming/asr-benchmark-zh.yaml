# 由 2026-10-15-ts-robust/baselines/asr-benchmark-20261012-no-robust-monitor.yaml 派生：
# 去掉“英文”“中英混合”“四川话”三组，保留普通话公开集和警务集，其余字段不变。
# 原因：X2Streaming-ASR 需要显式语言标签（这里统一用 zh），流式路线决策只看中文与警务。
task: asr
groups:
- name: 中文
  section: 公开测试集
  description: 常用普通话公开测试集
  labels:
  - wenetspeech_test_net
  - wenetspeech_test_meeting
  - aishell
  - aishell2
  - aishell3
  - magicdata
  - thchs30
  - kespeech
  - common_voice_zh
  aggregate: macro
- name: 指令识别
  section: 警务业务
  description: 警言警语 V6 指令
  labels:
  - police_v6_8h
  - police_v6_expanded
  - police_v6_acceptance_205
  aggregate: macro
- name: 术语与业务
  section: 警务业务
  description: 警务术语和业务用语
  labels:
  - police_terms_v5_test
  - police_incremental_20260916
  aggregate: macro
- name: 口音合成
  section: 警务业务
  description: 带口音的普通话合成语音
  labels:
  - police_synthetic_zh_accent_test
  - police_synthetic_zh_accent_test_qwen3_tts
  - police_synthetic_zh_accent_test_cosyvoice3
  aggregate: macro
