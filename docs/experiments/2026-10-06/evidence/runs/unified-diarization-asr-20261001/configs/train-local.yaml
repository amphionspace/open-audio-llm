version: 1
runtime:
  python:
    path: /ai_sds_wuzz/MODELS/miniconda3/envs/amphionft/bin/python
  cwd:
    path: /222042021/mingdong/workspace/open-audio-llm
  pythonpath:
  - path: /222042021/mingdong/workspace/open-audio-llm/src
  - path: /222042021/mingdong/workspace/open-audio-llm/runs/qwen3-asr-sot-speaker-events-20260922/dependencies/audio-data-contract/src
  gpus:
  - 0
  - 1
  threads:
    omp: 2
    openblas: 1
  environment:
    TOKENIZERS_PARALLELISM: false
    HF_HUB_OFFLINE: '1'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    PYTHONUNBUFFERED: '1'
    PYTORCH_ALLOC_CONF: expandable_segments:True
  distributed:
    processes: 2
    port: 29785
data:
  config:
    path: /222042021/mingdong/workspace/open-audio-llm/runs/unified-diarization-asr-20261001/shared/data/local-balanced-train.yaml
task:
  kind: train
  module: open_audio_llm.integrations.ms_swift.train
  positional:
  - sft
  arguments:
    --model_type: amphion_asr_1.7b
    --tuner_type: lora
    --lora_rank: 32
    --lora_alpha: 64
    --target_modules:
    - all-linear
    --freeze_vit: true
    --freeze_aligner: true
    --freeze_llm: false
    --torch_dtype: bfloat16
    --attn_impl: sdpa
    --max_length: 16384
    --per_device_train_batch_size: 1
    --per_device_eval_batch_size: 1
    --gradient_accumulation_steps: 16
    --learning_rate: 2.0e-05
    --max_steps: -1
    --lr_scheduler_type: inverse_sqrt
    --warmup_ratio: 0.0
    --warmup_steps: 500
    --gradient_checkpointing: true
    --vit_gradient_checkpointing: true
    --ddp_find_unused_parameters: true
    --dataloader_num_workers: 4
    --dataloader_persistent_workers: true
    --performance_logging: true
    --save_steps: 500
    --save_total_limit: 3
    --logging_steps: 5
    --report_to: none
    --seed: 42
    --audio_encoder_parallel: false
    --audio_encoder_batching: true
    --use_logits_to_keep: false
    --prediction_loss_only: true
    --optim: adamw_torch_fused
    --weight_decay: 0.01
    --max_grad_norm: 1.0
    --save_only_model: false
    --bf16: true
    --fp16: false
    --ddp_timeout: 7200
    --eval_strategy: 'no'
    --load_args: false
    --add_version: false
    --callbacks:
    - local_training_audit
    --model:
      path: /222042021/mingdong/workspace/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/train/attempts/003/artifacts/training/checkpoint-1000
    --external_plugins:
    - path: /222042021/mingdong/workspace/open-audio-llm/src/open_audio_llm/integrations/ms_swift/register_qwen3_asr.py
    - path: /222042021/mingdong/workspace/open-audio-llm/runs/unified-diarization-asr-20261001/scripts/local_training_audit.py
    --output_dir:
      path: '{attempt}/artifacts/training'
    --continuous_training: true
    --reset_catalog_sampler: true
    --lr_scheduler_kwargs:
      timescale: 10000
    --gradient_checkpointing_kwargs:
      use_reentrant: false
    --retention_eval_script: /222042021/mingdong/workspace/open-audio-llm/runs/unified-diarization-asr-20261001/scripts/local_checkpoint_eval.py
    --retention_eval_interval: 2000
preflight:
- kind: prepare
  module: open_audio_llm.data.catalog_cache
  arguments:
    --data_config:
      path: /222042021/mingdong/workspace/open-audio-llm/runs/unified-diarization-asr-20261001/shared/data/local-balanced-train.yaml
    --workers: 4
    --batch-size: 1
    --world-size: 2
    --preflight-report:
      path: '{attempt}/artifacts/data-preflight.json'
recording:
  attempts_dir:
    path: ../tasks/local-training/attempts
tracking:
  pythonpath:
  - path: /222042021/mingdong/workspace/open-audio-llm/src
  enabled: true
  python:
    path: /222042021/mingdong/workspace/open-audio-llm/runs/wandb-sync-env/bin/python
  credentials_file:
    path: ~/.bashrc
  entity: 1016097967-amphion
  project: open-audio-llm
  name: unified-diarization-local-lora
  interval: 5
  startup_timeout: 180
  finish_timeout: 300
parameters:
  checkpoint_evaluation:
    template:
      path: evaluate-71000.yaml
    gpu_memory_utilization: 0.6
    run_name: unified-diarization-local-lora-eval
    baseline_predictions:
      path: ../tasks/evaluate-71000/attempts/002/artifacts/evaluation/unified/predictions.jsonl
    baseline_asr_predictions:
      path: ../tasks/evaluate-71000/attempts/002/artifacts/evaluation/unified/asr-predictions.jsonl
