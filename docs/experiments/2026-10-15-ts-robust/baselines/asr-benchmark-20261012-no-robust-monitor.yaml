# 由 icefall/asr-benchmark@20261012 派生：去掉 police_robust_monitor 的 8 个子集（登记的 cuts 里 20 条
# 同一合成音频以两个来源目录各出现一次，样本 ID 重复，AmphionEval 拒绝运行），其余 26 个测试集不变。
# GigaSpeech 加 min_duration: 0.1：36 条 6 ms 的空参考碎片会让 vLLM 处理器报错（两个模型同样失败）。
task: asr
groups:
- name: 中文
  section: 公开测试集
  description: 常用普通话公开测试集
  labels:
  - wenetspeech_test_net
  - wenetspeech_test_meeting
  - aishell
  - aishell2
  - aishell3
  - magicdata
  - thchs30
  - kespeech
  - common_voice_zh
  aggregate: macro
- name: 英文
  section: 公开测试集
  description: 常用英文公开测试集
  labels:
  - librispeech_test_clean
  - librispeech_test_other
  - mls
  - gigaspeech
  - common_voice_en
  aggregate: macro
- name: 中英混合
  section: 公开测试集
  description: 一句话里中英文混着说
  labels:
  - talcs
  aggregate: macro
- name: 四川话
  section: 方言
  description: 四川话及西南官话口音
  labels:
  - wenetspeech_chuan_test_easy
  - wenetspeech_chuan_test_hard
  - kespeech_southwestern
  aggregate: macro
- name: 指令识别
  section: 警务业务
  description: 警言警语 V6 指令
  labels:
  - police_v6_8h
  - police_v6_expanded
  - police_v6_acceptance_205
