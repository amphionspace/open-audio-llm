- name: 术语与业务
  section: 警务业务
  description: 警务术语和业务用语
  labels:
  - police_terms_v5_test
  - police_incremental_20260916
  aggregate: macro
- name: 口音合成
  section: 警务业务
  description: 带口音的普通话合成语音
  labels:
  - police_synthetic_zh_accent_test
  - police_synthetic_zh_accent_test_qwen3_tts
  - police_synthetic_zh_accent_test_cosyvoice3
  aggregate: macro
