# AISHELL-5 素材的复查（shared/catalog-aishell5，scripts/build_dev_fidelity.py），其余与 eval-whole.yaml 相同。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/amphion-eval/bin/python}
  cwd: {path: ../../..}
  # AmphionEval 0.10.0（已发布，环境 amphion-eval）的 meeting 评测器；评测进程不 import 本项目。
  pythonpath: []
  gpus: []
  threads: {omp: 4, openblas: 1}
  environment:
    PYTHONUNBUFFERED: '1'
    NUMPY_MADVISE_HUGEPAGE: '0'
    AUDIO_DATA_CATALOG: /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-meeting-synth-20261031/shared/catalog-aishell5/catalog.yaml
    AUDIO_DATA_ROOTS_FILE: /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-meeting-synth-20261031/shared/catalog-aishell5/roots.json
task:
  kind: eval
  backend: vllm
  server_url: http://127.0.0.1:8761
  module: amphion_eval.cli
  positional: [open-audio-llm, meeting]
  arguments:
    --model: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/merge-8000/attempts/001/artifacts/merged-model}
    --data_config: {path: ../shared/catalog-aishell5/eval-set/eval-set.yaml}
    --split_group: evaluation
    --samples_per_source: 0
    --batch_size: 16
    --max_new_tokens: 4096
    --worker-timeout: 3600
    --server-url: http://127.0.0.1:8761
    --served-model: step8000
    --server-api: chat
    --output-format: open_audio_llm
    --output_dir: {path: '{attempt}/artifacts/evaluation'}
recording:
  attempts_dir: {path: ../tasks/12-aishell5-material/attempts}
  result: {path: '{attempt}/artifacts/evaluation/summary.json'}
tracking:
  pythonpath: [{path: ../../../src}]
  enabled: true
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python}
  credentials_file: {path: /workspace/workspace/mingdong/.config/open-audio-llm/wandb-cluster.sh}
  entity: 1016097967-amphion
  project: open-audio-llm
  name: many-speaker-real-mix-acp-20261009-step8000-panel
  interval: 30
  startup_timeout: 180
  finish_timeout: 300
  metrics:
  - file: {path: '{attempt}/artifacts/evaluation/summary.json'}
    prefix: evaluation
