# 保真度检查专用（scripts/build_dev_fidelity.py，AISHELL-5 素材的复查）：synth-v1.yaml 的在线会议合成配置，声学范围换成 AliMeeting 训练集
# 的测量值，因为被对照的 dev 窗口是 AliMeeting。其余字段与 synth-v1.yaml 相同。
