# 在线会议合成器 v1 的配置（open_audio_llm.data.meeting_online.OnlineMeetingConfig）。保真度检查
# （scripts/build_dev_fidelity.py、synth_label_stats.py）读这里的 online_meeting 段；训练数据配置复制同一段。
catalog: /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-meeting-synth-20261031/shared/catalog
roots: /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-meeting-synth-20261031/shared/roots.json
online_meeting:
  material: {dataset_id: meeting_synth_zh, version: v1-20261031, split: material}
  rir_sources:
  - {dataset_id: real_rir_slr28, version: prepared-20260908, split: all}
  noise_sources:
  - {dataset_id: meeting_room_noise, version: v2-20261014, split: train}
  # AliMeeting 与 AISHELL-5 各半：只用 AliMeeting 时 2 人、3 人会议各要重复约 60 遍（tasks/08-whole-conversations/README.md）；
  # AISHELL-5 的文字错误较高，抽查最差语句多为方言误识别，标注是人工的（tasks/02-fidelity-check/README.md）。
  corpus_weights: {alimeeting: 1.0, aishell5: 1.0}
  # 窗口用齐来源会议的所有人：抽 2 人于 4 人会议时起点模型 62% 多报说话人，用齐后 13%，cpER 近讲 22.4-23.4 → 18.9-19.8
  # （tasks/08-whole-conversations/README.md）。
  whole_conversations: true
  # 音轨与标注对不上的会议整场不用：串音 > -10 dB，或本人比本底高不到 6 dB（tasks/09-material-audit/README.md）。
  exclude_meetings:
  - R0004_M0022
  - R0004_M0027
  - R0008_M0075
  - R0008_M0076
  - R1019_M1971
  - R1019_M4056
  - aishell5-train-015
  - aishell5-train-016
  - aishell5-train-025
  - aishell5-train-043
  - aishell5-train-055
  - aishell5-train-075
  - aishell5-train-086
  - aishell5-train-099
  - aishell5-train-101
  - aishell5-train-115
  - aishell5-train-119
  - aishell5-train-122
  - aishell5-train-124
  - aishell5-train-128
  - aishell5-train-162
  - aishell5-train-187
  - aishell5-train-191
  - aishell5-train-223
  - aishell5-train-249
  - aishell5-train-259
  - aishell5-train-266
  - aishell5-train-291
  - aishell5-train-292
  - aishell5-train-293
  - aishell5-train-294
  - aishell5-train-295
  - aishell5-train-330
  - aishell5-train-363
  - aishell5-train-387
  - aishell5-train-406
  - aishell5-train-410
  - aishell5-train-422
  - aishell5-train-424
  - aishell5-train-450
  - aishell5-train-458
  - aishell5-train-462
  - aishell5-train-472
