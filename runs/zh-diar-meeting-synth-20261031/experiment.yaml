version: 1
name: zh-diar-meeting-synth-20261031
purpose: 方案第 1–2 步（../zh-diar-sim-real-gap-20261031）：在线会议合成器——真实会议时间轴 + 另一场真实对话的近讲语音 + 真实房间与会议室噪声，每轮重新配音；训练前在 AliMeeting dev 138 窗上做声学、排布与对话统计三项保真度检查
policy:
  evaluation_backend: vllm
  human_review_required: false
inputs:
  start_model: /workspace/data/ae-runs/zh-emilia2-dialogue-6000/checkpoint-6000
  diagnosis: ../zh-diar-sim-real-gap-20261031
  round2: ../zh-diar-aug-acp-20261030
  panel: meeting_selection_panel@v1-20261008:alimeeting_dev
  pool: meeting_synth_zh@v1-20261031
tasks:
- {id: build-pool, name: 时间轴模板与近讲素材池（scripts/build_meeting_pool.py → meeting_synth_zh@v1-20261031）, config: scripts/build_meeting_pool.py, depends_on: []}
- {id: fit-acoustics, name: 训练集真实远场的信噪比与各人音量差（scripts/fit_far_acoustics.py）, config: scripts/fit_far_acoustics.py, depends_on: [build-pool]}
- {id: fidelity-variants, name: dev 138 窗的合成保真度变体（scripts/build_dev_fidelity.py，训练代码同一路径）, config: scripts/build_dev_fidelity.py, depends_on: [fit-acoustics]}
- {id: fidelity-check, name: 起点模型在保真度变体上评测（3 次解码合并）, config: configs/probe-fidelity.yaml, depends_on: [fidelity-variants]}
- {id: synth-stats, name: 合成窗口的对话统计对照真实会议（scripts/synth_label_stats.py）, config: scripts/synth_label_stats.py, depends_on: [build-pool]}
