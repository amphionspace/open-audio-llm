# 挖题：template-twins-dialog-final-1117 checkpoint-3000 的普通识别服务（第 3 路，GPU 4，端口 19403）。由 08 的 configs/mining 经 scripts/make_configs.py 生成，只改模型、代码、vLLM 0.32、服务名与记录目录。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving-032/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v3/src
  gpus:
  - 4
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '0'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
    OPEN_AUDIO_LLM_ENABLE_MTP_DRAFT: '1'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/checkpoint-3000-f28e379337e1
  arguments:
    --host: 127.0.0.1
    --port: 19403
    --served-model-name: mine-ctx-asr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.5
    --max-model-len: 8192
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/01-mining/serve-asr-3/attempts
