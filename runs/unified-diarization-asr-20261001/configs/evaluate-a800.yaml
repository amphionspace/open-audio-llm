# 本机 8×A800 固定集评测，同时作为训练中 checkpoint 评测的模板（local_checkpoint_eval.py
# 只覆盖模型、输出、GPU 和记录名）。推理协议沿用 evaluate-71000.yaml：vLLM 0.18.0、BF16、
# TRITON_ATTN、完整音频 attention、temperature 0、seed 42、4096 token。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python}
  cwd: {path: ../../..}
  pythonpath:
  - {path: ../../../src}
  gpus: [0, 1, 2]
  threads: {omp: 4, openblas: 1}
  environment:
    TOKENIZERS_PARALLELISM: false
    HF_HUB_OFFLINE: '1'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    PYTHONUNBUFFERED: '1'
task:
  kind: eval
  backend: vllm
  script: {path: ../scripts/evaluate.py}
  accepts_config: true
  arguments: {}
parameters:
  output: {path: '{attempt}/artifacts/evaluation'}
  primary_candidate: step8000
  training_step: 8000
  reference_plan: {path: ../../qwen3-asr-sot-speaker-events-20260922/vllm-full-audio-checkpoint-21000-20260927/plan.json}
  reference_clips: {path: ../../qwen3-asr-sot-speaker-events-20260922/vllm-full-audio-checkpoint-21000-20260927/clips.jsonl}
  # 2026-10-06 从原机补传的同一批 338 条切片；infer.py 逐条核对 clips.jsonl 中的 SHA256。
  clip_audio_dir: {path: /workspace/data/migration/unified-diarization-20261001-transfer/statistical-moss-comparison-500-20260922/audio}
  scoring_helpers: {path: /workspace/data/migration/unified-diarization-20261001-transfer/statistical-moss-comparison-500-20260922/score.py}
  scoring_python: {path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python}
  # ASR 回访使用本机化后的同一 evaluation 分组（与 unified-train.yaml 一致）。
  data_config: {path: ../tasks/localize-data/attempts/004/artifacts/local-balanced-train.yaml}
  # 与训练进程共存时使用的显存比例；同机基线和各 checkpoint 一致。
  gpu_memory_utilization: 0.4
  attention_config: {backend: TRITON_ATTN}
  mm_encoder_attn_backend: TRITON_ATTN
  single_speaker_prompt: Transcribe the single speaker. Output [S1] followed by the transcription.
  models:
    unified: {path: /workspace/model/unified-diarization-20261001/unified-base-checkpoint-1000}
    step4000: {path: /workspace/model/unified-diarization-20261001/lora-002-step4000-merged}
    step8000: {path: ../tasks/merge-8000/attempts/001/artifacts/merged-model}
  cached_predictions: {}
  cached_asr_predictions: {}
recording:
  attempts_dir: {path: ../tasks/evaluate-a800/attempts}
  result: {path: '{attempt}/artifacts/evaluation/summary.json'}
tracking:
  pythonpath: [{path: ../../../src}]
  enabled: true
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python}
  credentials_file: {path: ~/.config/open-audio-llm/wandb-env.sh}
  entity: 1016097967-amphion
  project: open-audio-llm
  name: unified-diarization-a800-eval
  interval: 5
  startup_timeout: 180
  finish_timeout: 300
  metrics:
  - file: {path: '{attempt}/artifacts/evaluation/summary.json'}
    prefix: evaluate
