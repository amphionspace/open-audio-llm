# 180 秒会议评测集（build-meeting-benchmark）：中文真实会议、英文真实会议、6/8/10 人合成会议。
# 推理协议同固定集（vLLM 0.18.0、BF16、TRITON_ATTN、整段注意力、temperature 0、seed 42），
# 片段最长 244 秒，编码器整段注意力上限随评测集 plan 调到 26000。打分用 AmphionEval diarization 协议。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python}
  cwd: {path: ../../..}
  pythonpath:
  - {path: ../../../src}
  gpus: [0, 1, 2]
  threads: {omp: 4, openblas: 1}
  environment:
    TOKENIZERS_PARALLELISM: false
    HF_HUB_OFFLINE: '1'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    PYTHONUNBUFFERED: '1'
task:
  kind: eval
  backend: vllm
  script: {path: ../scripts/evaluate.py}
  accepts_config: true
  arguments: {}
parameters:
  output: {path: '{attempt}/artifacts/evaluation'}
  primary_candidate: step8000
  training_step: 8000
  reference_plan: {path: ../tasks/build-meeting-benchmark/attempts/003/artifacts/plan.json}
  reference_clips: {path: ../tasks/build-meeting-benchmark/attempts/003/artifacts/clips.jsonl}
  # infer.py 逐条核对 clips.jsonl 中的 SHA256。
  clip_audio_dir: {path: ../tasks/build-meeting-benchmark/attempts/003/artifacts/audio}
  # AmphionEval 0.6.0 diarization 协议：cpER 全样本（宽松提取说话人文字），DER 仅完整解析样本。
  scoring_script: score_benchmark.py
  scoring_python: {path: /workspace/workspace/mingdong/miniconda3/envs/amphion-eval/bin/python}
  # ASR 回访使用本机化后的同一 evaluation 分组（与 unified-train.yaml 一致）。
  data_config: {path: ../tasks/localize-data/attempts/004/artifacts/local-balanced-train.yaml}
  # 与训练进程共存时使用的显存比例；同机基线和各 checkpoint 一致。
  gpu_memory_utilization: 0.4
  attention_config: {backend: TRITON_ATTN}
  mm_encoder_attn_backend: TRITON_ATTN
  single_speaker_prompt: Transcribe the single speaker. Output [S1] followed by the transcription.
  models:
    unified: {path: /workspace/model/unified-diarization-20261001/unified-base-checkpoint-1000}
    step8000: {path: ../tasks/merge-8000/attempts/001/artifacts/merged-model}
    # 全参训练暂停前最新 checkpoint（选模集已退化，此处测其在部署长度上的表现）。
    full2500: {path: ../tasks/full-8000/attempts/001/artifacts/training/checkpoint-2500}
  cached_predictions: {}
  cached_asr_predictions: {}
recording:
  attempts_dir: {path: ../tasks/evaluate-meeting-benchmark/attempts}
  result: {path: '{attempt}/artifacts/evaluation/benchmark-summary.json'}
tracking:
  pythonpath: [{path: ../../../src}]
  enabled: true
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python}
  credentials_file: {path: ~/.config/open-audio-llm/wandb-env.sh}
  entity: 1016097967-amphion
  project: open-audio-llm
  name: unified-diarization-meeting180-eval
  interval: 5
  startup_timeout: 180
  finish_timeout: 300
  metrics:
  - file: {path: '{attempt}/artifacts/evaluation/benchmark-summary.json'}
    prefix: evaluate
