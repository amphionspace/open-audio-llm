version: 1
name: many-speaker-full-acp-20261008
purpose: 全参数训练补齐 6–12 人合成会议，英文只作少量回放
policy:
  evaluation_backend: vllm
  human_review_required: false
  training_coverage: all_eligible_records
  training_steps: 2000
tasks:
- id: prepare
  name: 准备多人合成与少量英文回放
