  backend: vllm
  script: /workspace/workspace/mingdong/repo/open-audio-llm/runs/many-speaker-full-acp-20261008/scripts/evaluate.py
  accepts_config: true
  arguments: {}
parameters:
  output:
    path: '{attempt}/artifacts/evaluation'
  primary_candidate: latest
  training_step: 8000
  reference_plan: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/build-meeting-benchmark/attempts/003/artifacts/plan.json
  reference_clips: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/build-meeting-benchmark/attempts/003/artifacts/clips.jsonl
  clip_audio_dir: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/build-meeting-benchmark/attempts/003/artifacts/audio
  scoring_script: score_benchmark.py
  scoring_python: /workspace/workspace/mingdong/miniconda3/envs/amphion-eval/bin/python
  data_config: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/localize-data/attempts/004/artifacts/local-balanced-train.yaml
