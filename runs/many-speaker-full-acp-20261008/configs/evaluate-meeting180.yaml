  attention_config:
    backend: TRITON_ATTN
  mm_encoder_attn_backend: TRITON_ATTN
  single_speaker_prompt: Transcribe the single speaker. Output [S1] followed by the
    transcription.
  models:
    latest: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/merge-8000/attempts/001/artifacts/merged-model
  cached_predictions:
    step8000: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/evaluate-meeting-benchmark/attempts/001/artifacts/evaluation/step8000/predictions.jsonl
