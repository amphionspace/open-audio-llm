      path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/evaluate-moss-meeting-benchmark/attempts/001/artifacts/predictions.jsonl
      format: moss
  cached_asr_predictions: {}
recording:
  attempts_dir:
    path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/many-speaker-full-acp-20261008/tasks/evaluate-meeting180/attempts
  result:
    path: '{attempt}/artifacts/evaluation/benchmark-summary.json'
tracking:
  pythonpath:
  - /workspace/workspace/mingdong/repo/open-audio-llm/runs/many-speaker-full-acp-20261008/shared/code/src
  enabled: true
  python: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  credentials_file: /workspace/workspace/mingdong/.config/open-audio-llm/wandb-cluster.sh
  entity: 1016097967-amphion
  project: open-audio-llm
  name: many-speaker-full-20261008-meeting180
  interval: 5
  startup_timeout: 180
  finish_timeout: 300
  metrics:
  - file:
      path: '{attempt}/artifacts/evaluation/benchmark-summary.json'
    prefix: evaluation
