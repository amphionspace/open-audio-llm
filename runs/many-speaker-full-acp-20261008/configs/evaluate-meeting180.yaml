version: 1
runtime:
  python: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python
  cwd: /workspace/workspace/mingdong/repo/open-audio-llm
  pythonpath:
  - /workspace/workspace/mingdong/repo/open-audio-llm/runs/many-speaker-full-acp-20261008/shared/code/src
  gpus:
  - 0
  threads:
    omp: 4
    openblas: 1
  environment:
    TOKENIZERS_PARALLELISM: false
    HF_HUB_OFFLINE: '1'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    PYTHONUNBUFFERED: '1'
task:
