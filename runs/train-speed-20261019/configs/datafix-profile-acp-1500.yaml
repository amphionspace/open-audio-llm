# 08 attempt 002 起的配置：与 datafix-acp-1500.yaml 相同，另在第 1201–1203 步记录每个 rank 的 CUDA 时间线
# （代码 shared/code-profile = code-data-fix + PR #71 的 performance.py / train.py，二者此前与 main 相同）。
# attempt 001 未开始训练即停掉，换成本配置，同一次节点占用多拿一份 GPU 时间线。
version: 1
runtime:
  python: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  cwd: /workspace/workspace/mingdong/repo/open-audio-llm-train-speed
  pythonpath:
  - /workspace/workspace/mingdong/repo/open-audio-llm-train-speed/runs/train-speed-20261019/shared/code-profile/src
  - /workspace/workspace/mingdong/repo/open-audio-llm-ts-robust/runs/ts-robust-acp-20261015/shared/code-v10/audio-data-contract-src
  gpus:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  threads:
    omp: 2
    openblas: 1
  environment:
    TOKENIZERS_PARALLELISM: false
    HF_HUB_OFFLINE: '1'
    PYTHONUNBUFFERED: '1'
    PYTORCH_ALLOC_CONF: expandable_segments:True
    PATH: /workspace/workspace/mingdong/.local-tools/ffmpeg-7.0.2-static/bin:/workspace/workspace/mingdong/miniconda3/envs/oal-train/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    TRITON_CACHE_DIR: /tmp/triton-cache
  distributed:
    processes: 8
    port: 29811
data:
  config: /workspace/workspace/mingdong/repo/open-audio-llm-ts-robust/runs/ts-robust-acp-20261015/configs/train-data-v7set4c.yaml
task:
  kind: train
  module: open_audio_llm.integrations.ms_swift.train
  positional:
  - sft
  arguments:
    --model: /workspace/data/ae-runs/ts-robust-026-ckpt25000/checkpoint-25000
    --model_type: amphion_asr_1.7b
    --external_plugins:
    - /workspace/workspace/mingdong/repo/open-audio-llm-train-speed/runs/train-speed-20261019/shared/code-profile/src/open_audio_llm/integrations/ms_swift/register_qwen3_asr.py
    --tuner_type: full
    --freeze_vit: false
    --freeze_aligner: false
    --freeze_llm: false
    --freeze_parameters:
    - thinker.model.embed_tokens
    - thinker.audio_tower.conv2d1
    - thinker.audio_tower.conv2d2
    - thinker.audio_tower.conv2d3
    - thinker.audio_tower.conv_out
    --deepspeed: /workspace/workspace/mingdong/repo/open-audio-llm-ts-robust/runs/ts-robust-acp-20261015/configs/zero1-bf16-no-overflow-check.json
    --torch_dtype: bfloat16
    --attn_impl: sdpa
    --max_length: 2048
    --per_device_train_batch_size: 12
    --per_device_eval_batch_size: 4
    --gradient_accumulation_steps: 2
    --learning_rate: 3.55e-06
    --weight_decay: 0.1
    --max_steps: 1500
    --lr_scheduler_type: cosine_with_min_lr
    --lr_scheduler_kwargs:
      min_lr: 1.0e-06
    --warmup_ratio: 0.0
    --warmup_steps: 500
    --gradient_checkpointing: false
    --vit_gradient_checkpointing: false
    --audio_encoder_batching: true
    --supervised_head_loss: true
    --ddp_find_unused_parameters: false
    --dataloader_num_workers: 20
    --dataloader_eval_num_workers: 12
    --dataloader_eval_prefetch_factor: 4
    --performance_logging: true
    --eval_strategy: 'no'
    --logging_steps: 10
    --report_to: none
    --seed: 42
    --check_model: false
    --load_args: false
    --add_version: false
    --output_dir:
      path: '{attempt}/artifacts/training'
    --ddp_timeout: 1800
    --max_grad_norm: 1.0
    --use_liger_kernel: true
    --packed_text: true
    --save_strategy: 'no'
    --torch_profile_steps:
    - 1201
    - 1203
preflight:
- kind: prepare
  module: open_audio_llm.data.catalog_cache
  arguments:
    --data_config: /workspace/workspace/mingdong/repo/open-audio-llm-ts-robust/runs/ts-robust-acp-20261015/configs/train-data-v7set4c.yaml
    --batch-size: 12
    --world-size: 8
    --preflight-report:
      path: '{attempt}/artifacts/data-preflight.json'
