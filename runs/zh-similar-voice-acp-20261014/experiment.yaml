version: 1
name: zh-similar-voice-acp-20261014
purpose: 加采真实会议与 Emilia2 对话里音色相近（窗口内最相近两人声纹相似度前 1/3）的窗口，去掉重叠远场重排，从 Emilia2 轮 6000 步继续，单机 8 卡 12000 步，目标是 AliMeeting dev 上音色相近窗口的说话人归错
policy:
  evaluation_backend: vllm
  human_review_required: false
  training_coverage: all_eligible_records
  training_steps: 12000
inputs:
  init_model: ../zh-emilia2-dialogue-acp-20261012/tasks/03-select/attempts/004/artifacts/models/checkpoint-6000
tasks:
- {id: prepare, name: 音色相近配比的数据配置, config: configs/prepare.yaml, depends_on: []}
- {id: train, name: ACP 单机 8 卡全参数 12000 步, config: configs/train.yaml, depends_on: [prepare]}
- {id: select, name: 开发机异步选模与结束评测, config: configs/select.yaml, depends_on: [prepare]}
