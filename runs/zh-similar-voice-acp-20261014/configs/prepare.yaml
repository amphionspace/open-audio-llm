version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  cwd:
    path: ../../..
  pythonpath: []
  gpus: []
  threads:
    omp: 1
    openblas: 1
  environment:
    PYTHONUNBUFFERED: '1'
task:
  kind: prepare
  script:
    path: ../scripts/prepare.py
  accepts_config: true
  arguments: {}
parameters:
  output:
    path: '{attempt}/artifacts'
  # The overlap round's frozen data configuration (its catalog already carries the overlap resimulation and the m4a
  # Emilia2 entry). Plan: docs/experiments/2026-10-14/next-round-plan.md.
  source_data:
    path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-overlap-farsim-acp-20261013/tasks/01-prepare/attempts/002/artifacts/train-data.yaml
  # The similar-voice views (version similar-voice-v1-20261014) come from the registry once amphiondata registers them
  # (selection: /workspace/workspace/mingdong/data/amphiondata/similar-voice-views-20261014); add their catalog
  # entries here. prepare fails on the missing entries until then.
  catalogs: []
  prefer_roots:
    path: /workspace/data/registry/roots.json
  # The overlap resimulation did not improve overlapped text on real meetings (zh-overlap-farsim-acp-20261013).
  drop:
  - {dataset_id: emilia2_zh_overlap_farsim}
  # Sample proportions (percent).
  rescale:
    real_meetings:
      previous_weight: 32.0
      weight: 37
      match:
      - {dataset_id: aishell4_meeting_sot}
      - {dataset_id: alimeeting_sdm_meeting_sot}
      - {dataset_id: magicdata_ramc_meeting_sot}
      - {dataset_id: aishell5_meeting_sot}
      - {dataset_id: cs_dialogue_meeting_sot}
    emilia2_dialogue:
      previous_weight: 16.0
      weight: 10
      match:
      - {dataset_id: emilia2_zh_dialogue_diarize}
    # Kept for the 6-12 speaker guard.
    synthetic_multispeaker:
      previous_weight: 15.096179277429382
      weight: 12
      match:
      - {dataset_id: sot_many_speaker_word_zh_en}
      - {dataset_id: sot_multispeaker_zh_en}
    single_speaker_asr:
      previous_weight: 10.5024
      weight: 12.6
      match:
      - {dataset_id: commonvoice_en_clean}
      - {dataset_id: kespeech}
      - {dataset_id: vitw_zh_far_asr}
      - {dataset_id: realman_zh_far_asr}
      - {dataset_id: threed_speaker_zh_far_asr}
      - {dataset_id: librispeech}
      - {dataset_id: aishell}
  # Remaining sources (near-field resimulation 4.48, English meetings 1.92) scale from 6.4014 to 6.4.
  scale_kept: true
  kept_weight: 6.4
  groups:
    # Real windows whose two most similar speakers (ERes2NetV2) are in the top third of their source and window
    # length, sampled again on top of real_meetings. Sources share the group like the base real-meeting weights
    # (AISHELL-4 and AliMeeting include their channel views there); the base exclusion lists still apply
    # (427 selected windows are on them).
    similar_real:
      weight: 12
      sources:
      - {dataset_id: aishell4_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 12.8, max_duration: 650, exclude_records: /workspace/workspace/mingdong/data/amphiondata/real-meetings-20261010/zh-v2-train-excluded-records.txt}
      - {dataset_id: alimeeting_sdm_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 10.24, max_duration: 650, exclude_records: /workspace/workspace/mingdong/data/amphiondata/real-meetings-20261010/zh-v2-train-excluded-records.txt}
      - {dataset_id: magicdata_ramc_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 3.2, max_duration: 650, exclude_records: /workspace/workspace/mingdong/data/amphiondata/real-meetings-20261010/zh-v2-train-excluded-records.txt}
      - {dataset_id: aishell5_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 3.2, max_duration: 650, exclude_records: /workspace/data/datasets/aishell5_meeting_sot/versions/far-mic-v1-20261010/train-empty-target-records.txt}
      - {dataset_id: cs_dialogue_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 2.56, max_duration: 650, exclude_records: /workspace/data/datasets/cs_dialogue_meeting_sot/versions/meeting-v1-20261010/train-empty-target-records.txt}
    # Same selection on the Emilia2 dialogue windows not used so far, after amphiondata's speaker-merge exclusion;
    # split name follows the registered view.
    similar_emilia2:
      weight: 10
      sources:
      - {dataset_id: emilia2_zh_dialogue_diarize, version: similar-voice-v1-20261014, splits: [train_120s], max_duration: 650}
  # The smallest earlier source still gets about one sample per window.
  replay_window_samples: 64000
  # Earlier rounds sampled with seeds 42-49.
  seed: 50
  # Real recordings get no added training noise.
  noise_exclude_datasets:
  - emilia2_zh_dialogue_diarize
recording:
  attempts_dir:
    path: ../tasks/01-prepare/attempts
  result:
    path: '{attempt}/artifacts/report.json'
tracking:
  enabled: false
