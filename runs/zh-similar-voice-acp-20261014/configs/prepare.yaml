version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  cwd:
    path: ../../..
  pythonpath: []
  gpus: []
  threads:
    omp: 1
    openblas: 1
  environment:
    PYTHONUNBUFFERED: '1'
task:
  kind: prepare
  script:
    path: ../scripts/prepare.py
  accepts_config: true
  arguments: {}
parameters:
  output:
    path: '{attempt}/artifacts'
  # The overlap round's frozen data configuration (its catalog already carries the overlap resimulation and the m4a
  # Emilia2 entry). Plan: docs/experiments/2026-10-14/next-round-plan.md.
  source_data:
    path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-overlap-farsim-acp-20261013/tasks/01-prepare/attempts/002/artifacts/train-data.yaml
  # Similar-voice views registered by amphiondata (registry catalog/similar_voice.yaml, 2026-10-15 copy); the real
  # meeting views already drop the base training exclusions, the Emilia2 view the speaker-merge windows.
  catalogs:
  - {catalog: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-similar-voice-acp-20261014/shared/similar-voice-catalog.jsonl, roots: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-similar-voice-acp-20261014/shared/similar-voice-roots.json}
  prefer_roots:
    path: /workspace/data/registry/roots.json
  # The overlap resimulation did not improve overlapped text on real meetings (zh-overlap-farsim-acp-20261013).
  drop:
  - {dataset_id: emilia2_zh_overlap_farsim}
  # The kept Emilia2 dialogue source also leaves out the windows where MOSS merged two speakers (amphiondata
  # speaker_merge check), on top of its 4+ speaker exclusion.
  exclude_records:
  - {dataset_id: emilia2_zh_dialogue_diarize, version: moss-transcribe-diarize-0.9B, path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-similar-voice-acp-20261014/shared/emilia2-exclude-4plus-and-speaker-merge.txt}
  # Sample proportions (percent).
  rescale:
    real_meetings:
      previous_weight: 32.0
      weight: 37
      match:
      - {dataset_id: aishell4_meeting_sot}
      - {dataset_id: alimeeting_sdm_meeting_sot}
      - {dataset_id: magicdata_ramc_meeting_sot}
      - {dataset_id: aishell5_meeting_sot}
      - {dataset_id: cs_dialogue_meeting_sot}
    emilia2_dialogue:
      previous_weight: 16.0
      weight: 10
      match:
      - {dataset_id: emilia2_zh_dialogue_diarize}
    # Kept for the 6-12 speaker guard.
    synthetic_multispeaker:
      previous_weight: 15.096179277429382
      weight: 12
      match:
      - {dataset_id: sot_many_speaker_word_zh_en}
      - {dataset_id: sot_multispeaker_zh_en}
    single_speaker_asr:
      previous_weight: 10.5024
      weight: 12.6
      match:
      - {dataset_id: commonvoice_en_clean}
      - {dataset_id: kespeech}
      - {dataset_id: vitw_zh_far_asr}
      - {dataset_id: realman_zh_far_asr}
      - {dataset_id: threed_speaker_zh_far_asr}
      - {dataset_id: librispeech}
      - {dataset_id: aishell}
  # Remaining sources (near-field resimulation 4.48, English meetings 1.92) scale from 6.4014 to 6.4.
  scale_kept: true
  kept_weight: 6.4
  groups:
    # Real windows whose two most similar speakers (ERes2NetV2) are in the top third of their source and window
    # length, sampled again on top of real_meetings. Sources share the group like the base real-meeting weights
    # (AISHELL-4 and AliMeeting include their channel views there).
    similar_real:
      weight: 12
      sources:
      - {dataset_id: aishell4_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 12.8, max_duration: 650}
      - {dataset_id: alimeeting_sdm_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 10.24, max_duration: 650}
      - {dataset_id: magicdata_ramc_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 3.2, max_duration: 650}
      - {dataset_id: aishell5_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 3.2, max_duration: 650}
      - {dataset_id: cs_dialogue_meeting_sot, version: similar-voice-v1-20261014, splits: [train_30s, train_120s, train_300s, train_600s], share: 2.56, max_duration: 650}
    # Same selection on the Emilia2 dialogue windows. 4+ speaker windows stay out as in the Emilia2 round (local 0.9B
    # labels usable on only 51-74% of them; the MOSS Pro relabel is still building): 18,159 of 55,126 selected.
    similar_emilia2:
      weight: 10
      sources:
      - {dataset_id: emilia2_zh_dialogue_diarize, version: similar-voice-v1-20261014, splits: [train_120s], max_duration: 650, exclude_records: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-similar-voice-acp-20261014/shared/emilia2-exclude-4plus-and-speaker-merge.txt}
  # The smallest earlier source still gets about one sample per window.
  replay_window_samples: 64000
  # Earlier rounds sampled with seeds 42-49.
  seed: 50
  # Real recordings get no added training noise.
  noise_exclude_datasets:
  - emilia2_zh_dialogue_diarize
recording:
  attempts_dir:
    path: ../tasks/01-prepare/attempts
  result:
    path: '{attempt}/artifacts/report.json'
tracking:
  enabled: false
