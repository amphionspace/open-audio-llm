# 部署推理栈的 vLLM HTTP 服务模板（与 many-speaker-long-acp-20261009/configs/serve-step8000.yaml 相同），
# 只多一个 --enable-log-requests：vLLM 对每个请求记录实际生效的 SamplingParams，驱动脚本据此核验解码设置。
# 模型、GPU、端口和解码设置（--override-generation-config）由 study 配置逐个作业填入。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python}
  cwd: {path: ../../..}
  pythonpath: []
  gpus: []
  threads: {omp: 4, openblas: 1}
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    PYTHONUNBUFFERED: '1'
task:
  kind: serve
  backend: vllm
  model: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/merge-8000/attempts/001/artifacts/merged-model}
  arguments:
    --host: 127.0.0.1
    --port: 8811
    --served-model-name: placeholder
    --dtype: bfloat16
    --max-model-len: 12288
    --max-num-seqs: 16
    --max-num-batched-tokens: 16384
    # 本机 GPU 与其他任务共享：固定占用约 24 GB，留出余量。
    --gpu-memory-utilization: 0.3
    --seed: 42
    --limit-mm-per-prompt: {audio: 1}
    --attention-config: {backend: TRITON_ATTN}
    --mm-encoder-attn-backend: TRITON_ATTN
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 26000
  flags: [--enforce-eager, --enable-log-requests]
recording:
  attempts_dir: {path: ../tasks/01-decode-runs/serve-template/attempts}
