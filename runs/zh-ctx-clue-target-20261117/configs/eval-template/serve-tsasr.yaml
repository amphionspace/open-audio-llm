# 由 scripts/make_eval_configs.py 从 zh-spelling-think-grpo-20261115 的 configs/eval-ctxv2-avg3-eagle3-k3/serve-tsasr.yaml 生成：换模型、草稿（自带 mtp/，EAGLE k=2）、代码、vLLM 0.32 环境、GPU、端口和记录目录。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving-032/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v1/src
  gpus:
  - 1
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '1'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/checkpoint-3000-184eb425f4e5
  arguments:
    --host: 127.0.0.1
    --port: 18711
    --served-model-name: template-tsasr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.2
    --max-model-len: 8192
    --chat-template:
      path: ../../shared/code-v1/src/open_audio_llm/integrations/vllm/qwen3_asr_think.jinja
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
    --speculative-config:
      method: eagle
      model: /workspace/data/ae-state/model-cache/entries/checkpoint-3000-184eb425f4e5/mtp
      num_speculative_tokens: 2
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/02-eval/serve-template-tsasr/attempts
