# tasks/08 对照组：与 tasks/07 只差数据配置里的 clean_teacher_feature_weight（本组没有）。用来区分"冻结 LLM 只训音频塔"本身和表示损失各自的作用。
# 冒烟：同正式配置，只跑 40 步、不存 checkpoint，用来核对表示损失生效（clean_rows、clean_feat）、冻结范围和速度。
# 与 v96（ts-robust-acp-20261015/configs/train-1node-v96-v94audfrozen.yaml）的差别：
#   起点 073 avg3 -> 11.17（ae 模型缓存 whitebox-merge-v18a-es116inc）；音频塔冻结 -> 解冻（同 v94）；
#   与 tasks/04 相比：--freeze_llm true；音频塔学习率 --vit_lr / --aligner_lr 5e-6（LLM 冻结，--learning_rate 不再起作用）；
#   训练文本切到 final-v1（audio-data-contract 5e20079）；代码 shared/code-v1 -> shared/code-v2（feat/ts-clean-teacher-kl 023232e）。
