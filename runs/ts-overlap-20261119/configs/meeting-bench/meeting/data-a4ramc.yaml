sampling_rate: 16000
enroll_seconds: 5
tags:
- zh
- target-speaker
groups:
- name: 整场会议逐段发送 · 目标在场
  section: 真实对话 · 整场会议
  labels:
  - meeting-aishell4-pos
  - meeting-ramc-pos
  description: 复现下游 speaker-enroll 回放会议的发送方式：会上每人注册一次，每段话发给每个注册人的框。目标在场时的字错率与漏识率
- name: 整场会议逐段发送 · 目标缺席
  section: 真实对话 · 整场会议
  labels:
  - meeting-aishell4-neg
  - meeting-ramc-neg
  description: 复现下游 speaker-enroll 回放会议的发送方式：会上每人注册一次，每段话发给每个注册人的框。目标缺席时的误输出率（下游串人 badcase：AISHELL-4 3.8%，手机远场会议 47.9%）
- name: 定位对照 · 别场注册 · 目标缺席
  section: 真实对话 · 整场会议对照
  labels:
  - meeting-ramc-neg-xrec
  description: 同一批段，注册换成同语料另一场录音里的人：与段内最像的在场人的声纹相似度最接近原注册（labels.base_impostor_sim、xrec_sim_gap）。与基础组逐条配对，检验同一录音的注册是否被当成目标的证据；与同名基础组（不带后缀）逐条配对比较（metadata.base）
