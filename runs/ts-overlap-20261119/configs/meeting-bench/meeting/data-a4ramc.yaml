- dataset_id: ts_asr_real
  version: meeting-v3-20261117
  split: meeting-aishell4-pos
  task: ts_asr
  label: meeting-aishell4-pos
  tags:
  - zh
  - target-speaker
  display: 整场会议 · AISHELL-4 · 目标在场
  description: AISHELL-4 test 20 场会议远场通道 0（5–7 人），按人工标注把同一人相邻语句并成段（同下游 MOSS 分段，落在别人话里的插话不单独成段），每段发给会上每个注册人（注册取本人会上最早的干净语句，客户端取前 5 秒）。本人在段内说话 ≥0.5 秒且语句完整在段内，参考为这些语句。
