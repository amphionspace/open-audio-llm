version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  cwd:
    path: ../../..
  pythonpath: []
  gpus: []
  threads:
    omp: 1
    openblas: 1
  environment:
    PYTHONUNBUFFERED: '1'
task:
  kind: prepare
  script:
    path: ../scripts/prepare.py
  accepts_config: true
  arguments: {}
parameters:
  output:
    path: '{attempt}/artifacts'
  # The overlap round's frozen data configuration (its catalog already carries the overlap resimulation and the m4a
  # Emilia2 entry). Plan: docs/experiments/2026-10-14/next-round-plan.md.
  source_data:
    path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-overlap-farsim-acp-20261013/tasks/01-prepare/attempts/002/artifacts/train-data.yaml
  # No new catalog and no extra groups: the control only removes the similar-voice weighting of the previous round.
  catalogs: []
  groups: {}
  # The registry's legacy_asr root (/workspace/data, changed 2026-10-15 20:13 UTC) has no LHOTSE/data_aishell, so AISHELL-1 fails
  # the data preflight there; the localized copy the frozen configuration points to has it (zh-similar-voice-acp-20261014 used it).
  keep_roots: [legacy_asr]
  prefer_roots:
    path: /workspace/data/registry/roots.json
  # The overlap resimulation did not improve overlapped text on real meetings (zh-overlap-farsim-acp-20261013).
  drop:
  - {dataset_id: emilia2_zh_overlap_farsim}
  # The kept Emilia2 dialogue source also leaves out the windows where MOSS merged two speakers (amphiondata
  # speaker_merge check), on top of its 4+ speaker exclusion.
  exclude_records:
  - {dataset_id: emilia2_zh_dialogue_diarize, version: moss-transcribe-diarize-0.9B, path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-nosimilar-control-acp-20261016/shared/emilia2-exclude-4plus-and-speaker-merge.txt}
  # Sample proportions (percent).
  rescale:
    real_meetings:
      previous_weight: 32.0
      weight: 49
      match:
      - {dataset_id: aishell4_meeting_sot}
      - {dataset_id: alimeeting_sdm_meeting_sot}
      - {dataset_id: magicdata_ramc_meeting_sot}
      - {dataset_id: aishell5_meeting_sot}
      - {dataset_id: cs_dialogue_meeting_sot}
    emilia2_dialogue:
      previous_weight: 16.0
      weight: 20
      match:
      - {dataset_id: emilia2_zh_dialogue_diarize}
    # Kept for the 6-12 speaker guard.
    synthetic_multispeaker:
      previous_weight: 15.096179277429382
      weight: 12
      match:
      - {dataset_id: sot_many_speaker_word_zh_en}
      - {dataset_id: sot_multispeaker_zh_en}
    single_speaker_asr:
      previous_weight: 10.5024
      weight: 12.6
      match:
      - {dataset_id: commonvoice_en_clean}
      - {dataset_id: kespeech}
      - {dataset_id: vitw_zh_far_asr}
      - {dataset_id: realman_zh_far_asr}
      - {dataset_id: threed_speaker_zh_far_asr}
      - {dataset_id: librispeech}
      - {dataset_id: aishell}
  # Remaining sources (near-field resimulation 4.48, English meetings 1.92) scale from 6.4014 to 6.4.
  scale_kept: true
  kept_weight: 6.4
  # The smallest earlier source still gets about one sample per window.
  replay_window_samples: 64000
  # Earlier rounds sampled with seeds 42-49.
  seed: 50
  # Real recordings get no added training noise.
  noise_exclude_datasets:
  - emilia2_zh_dialogue_diarize
recording:
  attempts_dir:
    path: ../tasks/01-prepare/attempts
  result:
    path: '{attempt}/artifacts/report.json'
tracking:
  enabled: false
