version: 1
name: zh-asr-retention-acp-20261012
purpose: 单人 ASR 能力恢复：在中文对话轮 18000 步上加入 25% 普通格式单人中文数据（WenetSpeech 清洗版等），单机 8 卡 12000 步，会议与对话能力不退化
policy:
  evaluation_backend: vllm
  human_review_required: false
  training_coverage: all_eligible_records
  training_steps: 12000
inputs:
  init_model: ../zh-dialogue-mix-acp-20261010/tasks/03-select/attempts/004/artifacts/models/checkpoint-18000
tasks:
- {id: prepare, name: 单人 ASR 恢复配比的数据配置, config: configs/prepare.yaml, depends_on: []}
- {id: train, name: ACP 单机 8 卡全参数 12000 步, config: configs/train.yaml, depends_on: [prepare]}
- {id: select, name: 开发机异步选模与结束评测, config: configs/select.yaml, depends_on: [prepare]}
