version: 1
name: zh-first-mix-acp-20261010
purpose: 中文优先配比（中文真实会话 48%、英文会议 6%），从 12000 步续训权重继续 24000 步
policy:
  evaluation_backend: vllm
  human_review_required: false
  training_coverage: all_eligible_records
  training_steps: 24000
inputs:
  init_model: ../many-speaker-continue-acp-20261009/tasks/03-select/attempts/002/artifacts/models/checkpoint-12000
tasks:
- {id: prepare, name: 中文优先配比的数据配置, config: configs/prepare.yaml, depends_on: []}
- {id: train, name: ACP 16 卡全参数 24000 步, config: configs/train.yaml, depends_on: [prepare]}
- {id: select, name: 开发机异步选模与结束评测, config: configs/select.yaml, depends_on: [prepare]}
