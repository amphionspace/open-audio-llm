  clips: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/prepare-full-training-data/attempts/001/artifacts/selection/clips.jsonl}
  clip_audio_dir: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/prepare-full-training-data/attempts/001/artifacts/selection/audio}
  dataset_id: legacy_zh_selection_245
  version: '20261001'
  splits: {aishell4: aishell4, alimeeting: alimeeting}
  language: zh
  records_alias: legacy_zh_selection_245
  audio_alias: legacy_zh_selection_245_audio
  description: unified-diarization-asr-20261001 prepare-full-training-data 执行 001 的 245 条中文选模片段（起点模型训练见过的会议），只作一致性核对
recording:
  attempts_dir: {path: ../tasks/02-export-zh245/attempts}
  result: {path: '{attempt}/artifacts/report.json'}
tracking:
  enabled: false
