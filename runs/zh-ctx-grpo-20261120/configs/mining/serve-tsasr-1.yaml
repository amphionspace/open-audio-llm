# 挖题：template-synth-ts-twins checkpoint-3000 的TS服务（第 1 路，GPU 2，端口 19411）。由 08 的 configs/mining 经 scripts/make_configs.py 生成，只改模型、代码、vLLM 0.32、服务名与记录目录。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving-032/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v2/src
  gpus:
  - 2
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '1'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/checkpoint-3000-061b86c3902e
  arguments:
    --host: 127.0.0.1
    --port: 19411
    --served-model-name: mine-ctx-tsasr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.5
    --max-model-len: 8192
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/01-mining/serve-tsasr-1/attempts
