    port: 29736
data:
  config:
    path: train-data-grpo.yaml
task:
  kind: train
  module: open_audio_llm.integrations.ms_swift.train
  positional:
  - grpo
  arguments:
    --rlhf_type: grpo
    --model: /workspace/data/ae-state/model-cache/entries/checkpoint-3000-061b86c3902e
    --model_type: amphion_asr_1.7b
    --external_plugins:
    - path: ../shared/code-v3/src/open_audio_llm/integrations/ms_swift/register_qwen3_asr.py
    - path: ../shared/code-v3/src/open_audio_llm/integrations/ms_swift/rewards/plugin.py
    --tuner_type: full
    --freeze_vit: false
    --freeze_aligner: false
    --freeze_llm: false
    --freeze_parameters:
    - thinker.model.embed_tokens
    - thinker.audio_tower.conv2d1
    - thinker.audio_tower.conv2d2
    - thinker.audio_tower.conv2d3
    - thinker.audio_tower.conv_out
    --deepspeed:
      path: zero1-bf16-no-overflow-check.json
    --torch_dtype: bfloat16
    --attn_impl: sdpa
    --max_length: 2048
    --max_completion_length: 512
    --num_generations: 8
    --per_device_train_batch_size: 8
    --gradient_accumulation_steps: 4
    --temperature: 1.0
    --beta: 0.04
    --learning_rate: 1.0e-06
    --lr_scheduler_type: constant_with_warmup
    --warmup_steps: 20
    --max_steps: 400
    --max_grad_norm: 1.0
    --reward_funcs:
    - qwen3_asr_accuracy
    - qwen3_asr_presence
    - qwen3_asr_hotword
    - qwen3_asr_format
    - qwen3_asr_context
    --reward_weights:
    - 1.0
    - 1.0
    - 1.0
    - 0.25
    - 1.0
    --use_vllm: false
    --log_completions: true
    --log_rollout_offpolicy_metrics: true
    --logging_steps: 1
    --save_steps: 100
    --save_only_model: true
    --report_to: none
    --seed: 42
    --dataloader_num_workers: 8
    --check_model: false
    --load_args: false
    --add_version: false
    --ddp_timeout: 1800
    --output_dir:
      path: '{attempt}/artifacts/training'
    --joint_mtp_weight: 0.1
    --joint_mtp_steps: 3
    --joint_mtp_step_decay: 0.8
    --joint_mtp_lr: 1.0e-05
    --joint_mtp_init: /workspace/data/ae-state/model-cache/entries/checkpoint-3000-061b86c3902e/mtp/model.safetensors
