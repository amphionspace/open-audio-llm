# 由 scripts/make_eval_configs.py（抄自 zh-ctx-clue-target-20261117）从 zh-spelling-think-grpo-20261115 的 configs/eval-ctxv2-avg3-eagle3-k3/serve-asr.yaml 生成：换模型、草稿（自带 mtp/，EAGLE k=2）、代码、vLLM 0.32 环境、GPU、端口和记录目录。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving-032/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v3/src
  gpus:
  - 2
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '0'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
    OPEN_AUDIO_LLM_ENABLE_MTP_DRAFT: '1'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/model-3727ca75443ad6fa0139aad9
  arguments:
    --host: 127.0.0.1
    --port: 18902
    --served-model-name: delivery-avg3-b-asr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.2
    --max-model-len: 8192
    --chat-template:
      path: ../../shared/code-v3/src/open_audio_llm/integrations/vllm/qwen3_asr_think.jinja
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
    --speculative-config:
      method: eagle
      model: /workspace/data/ae-state/model-cache/entries/model-3727ca75443ad6fa0139aad9/mtp
      num_speculative_tokens: 2
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/03-eval/serve-delivery-avg3-b-asr/attempts
