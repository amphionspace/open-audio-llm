# 正式草稿头训练（未启动，由用户作为记录实验提交）：10.28 版本（054 avg3）权重全部冻结，只训练一层 EAGLE 草稿头，
# 用于 vLLM 0.18 投机解码（--speculative-config method eagle）。数据 = 054 的训练数据配方原样（configs/train-data.yaml）。
# 与 01-validate-draft/002（4 卡 2500 步，见任务 README）相比只改规模：8 卡、步数、warmup；学习率、草稿步数 3、衰减 0.8 相同。
# 目标损失：草稿头对冻结模型“下下个 token”分布的 KL，按 vLLM 草稿的 3 步展开（见 src/open_audio_llm/integrations/ms_swift/draft_head.py）。
# checkpoint 只含草稿头：model.safetensors（mtp_draft.*，续训用）+ eagle/（vLLM 草稿目录，config.json + 权重）。
# 骨干换成 GRPO 等新权重时必须换 --model 重训草稿头：草稿头读的是骨干最后一层的隐状态。
version: 1
runtime:
  python: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  cwd: {path: ../../..}
  # 提交前用 scripts/snapshot_code.sh 把本分支代码快照到 shared/code（任务容器只挂载 /workspace）。
  pythonpath: [{path: ../shared/code/src}]
  gpus: [0, 1, 2, 3, 4, 5, 6, 7]
  threads: {omp: 2, openblas: 1}
  environment:
    TOKENIZERS_PARALLELISM: false
    HF_HUB_OFFLINE: '1'
    PYTHONUNBUFFERED: '1'
    PYTORCH_ALLOC_CONF: expandable_segments:True
    # Emilia2 m4a 经 lhotse 调用 PATH 上的 ffmpeg（与 054 相同的静态版本）。
    PATH: /workspace/workspace/mingdong/.local-tools/ffmpeg-7.0.2-static/bin:/workspace/workspace/mingdong/miniconda3/envs/oal-train/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  distributed: {processes: 8, port: 29871}
data:
  config: {path: train-data.yaml}
task:
  kind: train
  module: open_audio_llm.integrations.ms_swift.train
  positional: [sft]
  arguments:
    --model: /workspace/data/packages/amphionasr-1.7b-v3-tsrobust-054avg3/model
    --model_type: amphion_asr_1.7b
    --external_plugins: [{path: ../shared/code/src/open_audio_llm/integrations/ms_swift/register_qwen3_asr.py}]
    # 全部骨干参数由 --draft_head_steps 冻结（requires_grad=False、eval 模式、no_grad 前向）；tuner_type 只决定 ms-swift 的流程。
    --tuner_type: full
    --draft_head_steps: 3
    --draft_head_step_decay: 0.8
    # 草稿头只有 6000 万参数：DDP 即可，DeepSpeed 与草稿头不兼容（训练入口会拒绝）。
    --torch_dtype: bfloat16
    --attn_impl: sdpa
    --max_length: 2048
    --per_device_train_batch_size: 12
    --per_device_eval_batch_size: 4
    # 与数据配置 batching.accumulation 一致；全局 batch 12 × 8 × 2 = 192 条。
    --gradient_accumulation_steps: 2
    --learning_rate: 1.0e-04
    --weight_decay: 0.0
    --max_steps: 20000
    --lr_scheduler_type: cosine_with_min_lr
    --lr_scheduler_kwargs: {"min_lr": 0.00001}
    --warmup_ratio: 0.0
    --warmup_steps: 300
    --gradient_checkpointing: false
    --vit_gradient_checkpointing: false
    --audio_encoder_batching: true
    --ddp_find_unused_parameters: false
    --dataloader_num_workers: 12
    --performance_logging: true
    --save_steps: 2000
    --eval_strategy: 'no'
    --logging_steps: 10
    --report_to: none
    --seed: 42
    --check_model: false
    --load_args: false
    --add_version: false
    --output_dir: {path: '{attempt}/artifacts/training'}
    --ddp_timeout: 1800
    --max_grad_norm: 1.0
preflight:
- kind: prepare
  module: open_audio_llm.data.catalog_cache
  arguments:
    --data_config: {path: train-data.yaml}
    --batch-size: 12
    --world-size: 8
    --preflight-report: {path: '{attempt}/artifacts/data-preflight.json'}
recording:
  attempts_dir: {path: ../tasks/03-train-draft/attempts}
tracking:
  pythonpath: [{path: ../shared/code/src}]
  enabled: true
  python: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  credentials_file: /workspace/workspace/mingdong/.config/open-audio-llm/wandb-cluster.sh
  entity: 1016097967-amphion
  project: open-audio-llm
  name: AmphionASR-mtp-draft-eagle-k3-on-1028-054avg3-20k-1node
  interval: 5
  startup_timeout: 180
  finish_timeout: 300
cluster:
  kind: acp
  sco_home: /workspace/workspace/mingdong/.local-tools/sco
  credentials: /workspace/workspace/mingdong/repo/open-audio-llm/third_party/amphionkeys/sensecore.env
  workspace: workspace-whai
  aec2: cluster-whai
  image: registry.cn-sh-01.sensecore.cn/ccr-wh/amphion-base:amphion-base-20260923072955
  worker_spec: N3lS.Ii.I60.94c944g
  nodes: 1
  priority: HIGHEST
  quota_type: reserved
  wait: true
  mounts:
  - 01a0c847-3d8d-7b42-8c75-50cbd189bb56:/workspace
  environment:
    NCCL_IB_TIMEOUT: 22
    NCCL_IB_RETRY_CNT: 13
    NCCL_IB_AR_THRESHOLD: 0
storage:
  executable: /workspace/workspace/mingdong/.local/share/amphion-bucket/cluster-venv/bin/ab
  remote: whai:open-audio-llm
  local_root: {path: ../../..}
