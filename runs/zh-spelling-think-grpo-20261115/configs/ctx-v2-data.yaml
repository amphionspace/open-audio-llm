# 09-ctx-v2-eval：上下文纠偏评测集 v2 的定义（audio-data-contract eval_set.py 生成），catalog 用登记 v2 的提交；由 scripts/make_ctx_v2_configs.py 生成
catalog: /workspace/workspace/mingdong/repo/adc-ctx-v2-9f8af4c/catalog
roots: /workspace/data/registry/roots.json
tags:
- zh
- context-correction
groups:
- name: 上下文纠偏 · 合成 · 同源
  section: 上下文纠偏
  labels:
  - synthetic
  description: 看 summary 的 context_correction：纠正成功率、保持率（误改率）、说明识别率、条件纠正率、成对正确率
- name: 上下文纠偏 · TS 模式 · 同源
  section: 上下文纠偏
  labels:
  - synthetic_ts
  description: 同上，TS-ASR 请求（注册音频 + 识别片段）
- name: 上下文纠偏 · 合成 · 独立
  section: 上下文纠偏
  labels:
  - synthetic_indep
  description: 同上；与同源组的差距就是只学会训练模板的程度
- name: 上下文纠偏 · TS 模式 · 独立
  section: 上下文纠偏
  labels:
  - synthetic_indep_ts
  description: 同上，TS-ASR 请求
- name: 上下文纠偏 · 真实录音
  section: 上下文纠偏
  labels:
  - mined_real
  - mined_real_emilia
  description: 真实录音；每条单独成题（没有成对的确认题），看 mined_accuracy，按 source 和 train_overlap 分开看
