# 挖掘：第二轮 think checkpoint-3000 TS服务（第 0 路，GPU 1，端口 19410）。由 oal-grpo configs/mining-v15interp/serve-tsasr-0.yaml 经 scripts/make_configs.py 复制，只改模型、代码、服务名与记录目录。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v2/src
  gpus:
  - 1
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '1'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/checkpoint-3000-927844461eb1
  arguments:
    --host: 127.0.0.1
    --port: 19410
    --served-model-name: mine-r2think-tsasr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.5
    --max-model-len: 8192
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/01-mining/serve-tsasr-0/attempts
