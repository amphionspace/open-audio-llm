# 07-draft-accept：avg3 挂 06 训练的 EAGLE-3 草稿头（k=3），由 scripts/make_draft_accept_configs.py 从 configs/eval-grpo-avg3-mtp/serve-asr.yaml 生成，只换草稿、GPU、端口和记录目录。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v3/src
  gpus:
  - 0
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '0'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
    OPEN_AUDIO_LLM_ENABLE_MTP_DRAFT: '1'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/model-377c0d630417ca1fc281e847
  arguments:
    --host: 127.0.0.1
    --port: 18980
    --served-model-name: grpo-avg3-eagle3-k3-asr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.2
    --max-model-len: 8192
    --chat-template:
      path: ../../shared/code-v3/src/open_audio_llm/integrations/vllm/qwen3_asr_think.jinja
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
    --speculative-config:
      method: eagle3
      model: /workspace/workspace/mingdong/repo/oal-think-exp/runs/zh-spelling-think-grpo-20261115/tasks/06-train-draft/attempts/003/artifacts/training/checkpoint-10000/eagle
      num_speculative_tokens: 3
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/07-draft-accept/serve-k3-asr/attempts
