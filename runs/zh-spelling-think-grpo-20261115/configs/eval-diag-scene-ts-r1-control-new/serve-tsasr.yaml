# 08-scene-ts-diag：由 scripts/make_scene_ts_diag_configs.py 从 configs/eval-grpo-avg3/serve-tsasr.yaml 生成，只换模型、GPU、端口和记录目录，不开 MTP。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v2/src
  gpus:
  - 7
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '1'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/model-c2f5f2dfaa8faaa5c7267ddb
  arguments:
    --host: 127.0.0.1
    --port: 18995
    --served-model-name: diag-scene-ts-r1-control-new-tsasr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.2
    --max-model-len: 8192
    --chat-template:
      path: ../../shared/code-v2/src/open_audio_llm/integrations/vllm/qwen3_asr_think.jinja
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/08-scene-ts-diag/serve-r1-control-new/attempts
