# 09-ctx-v2-eval：由 scripts/make_ctx_v2_configs.py 从 configs/eval-grpo-avg3-eagle3-k3/serve-tsasr.yaml 生成，只换模型、GPU、端口和记录目录。
version: 1
runtime:
  python:
    path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python
  cwd:
    path: ../../../..
  pythonpath:
  - path: ../../shared/code-v3/src
  gpus:
  - 3
  threads:
    omp: 4
    openblas: 1
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    AMPHION_TSASR_INSERT_SEP: '1'
    AMPHION_TSASR_ENROLL_SEC: '5'
    AMPHION_TSASR_ENROLL_NOPAD: '0'
    COT_TSASR_ENROLL_RANDOM: '0'
    COT_AUDIO_CHUNKED_ATTN: '0'
task:
  kind: serve
  backend: vllm
  model:
    path: /workspace/data/ae-state/model-cache/entries/model-377c0d630417ca1fc281e847
  arguments:
    --host: 127.0.0.1
    --port: 19013
    --served-model-name: ctxv2-avg3-eagle3-k3-tsasr
    --dtype: bfloat16
    --tensor-parallel-size: 1
    --limit-mm-per-prompt:
      audio: 1
    --gpu-memory-utilization: 0.2
    --max-model-len: 8192
    --chat-template:
      path: ../../shared/code-v3/src/open_audio_llm/integrations/vllm/qwen3_asr_think.jinja
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 1000000000
    --speculative-config:
      method: eagle3
      model: /workspace/workspace/mingdong/repo/oal-think-exp/runs/zh-spelling-think-grpo-20261115/shared/draft-avg3-eagle3-10k
      num_speculative_tokens: 3
  flags:
  - --trust-remote-code
  - --no-enable-prefix-caching
recording:
  attempts_dir:
    path: ../../tasks/09-ctx-v2-eval/serve-avg3-eagle3-k3-tsasr/attempts
