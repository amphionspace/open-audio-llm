  provenance:
    source: RealMAN (Westlake University Audio Signal and Information Processing Lab with AISHELL), Hugging Face dataset AISHELL/RealMAN
    url: https://github.com/Audio-WestlakeU/RealMAN
    snapshot_date: '2026-10-25'
    license: CC BY 4.0
    description: RealMAN 真实录制的 32 麦阵列中文数据（NeurIPS 2024）：扬声器在 32 个真实场景（教室、办公室、食堂、球场、地铁、公交、轿车、街边等）外放普通话，阵列录下 32 路 48 kHz 音频，含静止和移动声源，每句带直达声干净参考（dp_speech）、声源方位和距离、转写。语音共
      51147 句、83.7 小时（train 64.0、val 8.1、test 11.6），来自 55 个说话人的 19629 条不同句子，三个划分之间句子和说话人都不重叠；另有 31 个场景的纯噪声录音 144.5 小时。用于多通道/单通道降噪、远场
      ASR 和声源定位；单通道用时取任意一个 CH。val/test 的 ma_noisy_speech 是官方带噪混合，*_raw 里是对应的干净阵列语音和噪声。这是完整版（32 通道全部解压）；只要 ASR 的 CH0 可用 `realman@icefall-20260908`。
    acquisition: Downloaded all 253 files of the pinned Hugging Face snapshot (commit fea47505) from hf-mirror.com; each file's sha256
      equals its LFS oid (hf-snapshot.json). The 196 RAR5 archives were extracted with bsdtar 3.8.8 into extracted/<split>/<subset>/
      after checking that every member is a regular file or directory under the archive's scene directory, and the extracted file count
      of each archive matches its listing. After every extracted directory and the full version passed check-registration on 2026-10-26,
      the 196 archives (about 812 GB) were deleted to save space; their sizes and sha256 remain in hf-snapshot.json.
    known_issues:
    - transcriptions.trn holds 474 sentence IDs that no released utterance uses.
    - The source RAR archives are not kept here. To re-extract, download them again from the pinned revision; 57 of them (train/ma_speech,
      val/ma_noisy_speech, test/ma_noisy_speech) are still in realman@icefall-20260908's source/icefall-20260908.
    integrity: local_sha256_recorded
