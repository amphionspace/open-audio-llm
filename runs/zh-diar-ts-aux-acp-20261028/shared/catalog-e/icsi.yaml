  provenance:
    source: ICSI Meeting Corpus (International Computer Science Institute, Berkeley), distributed by the University of Edinburgh. Audio
      and speaker segments from the argmaxinc/icsi-meetings mirror on ModelScope; transcripts and NXT annotations from Edinburgh.
    url: https://groups.inf.ed.ac.uk/ami/icsi/
    snapshot_date: '2026-10-25'
    license: CC BY 4.0
    description: ICSI 会议语料：伯克利 ICSI 研究所 2000–2002 年录的 75 场真实英文工作会议（每场 3–10 人，共 53 位登记说话人），71.7 小时。这一版的音频是官方的近讲混合音轨（把所有人的头戴麦叠成一路，16
      kHz 单声道），每场带说话人分段（12.9 万段），适合做说话人日志评测；另附官方 MRT 原始转写（含时间、说话人）和 NXT 标注（词、分段、对话行为），可做多人会议 ASR。不含远场桌面麦通道。
    acquisition: Downloaded every file of the ModelScope repo at revision 27a0bbf6 (each parquet's sha256 equals the ModelScope LFS
      sha256, modelscope-snapshot.json). Downloaded the two annotation zips from Edinburgh; their sizes match the server's Content-Length
      and both pass the zip CRC test. Both zips were extracted under extracted/ with Python zipfile; no member path leaves the archive
      root.
    known_issues:
    - The audio is the headset mix, not a far-field channel. The desk PZM channels (chan6, chan7, chanE, chanF) exist only on the Edinburgh
      server, which serves about 80 KB/s in total to this host.
    - data/train-00000-of-00001.parquet is not audio. It is the uploader's local file list (997 paths under /Users/...), and the mirror's
      README does not declare it as a split.
    - transcripts/preambles.mrt is a shared preamble file, not a meeting.
    integrity: local_sha256_recorded
