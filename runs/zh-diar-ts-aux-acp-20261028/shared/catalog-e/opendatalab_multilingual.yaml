    description: OpenDataLab 多语言语音识别数据，8 个语种（ar 阿拉伯语、cs 捷克语、hu 匈牙利语、ko 韩语、ru 俄语、sr 塞尔维亚语、th 泰语、vi 越南语），每语种约 1000 小时。16 kHz
      单声道 WAV 切片，每个语种一份 JSONL 清单（id、audio.path/duration/snr、text.content/lang、pjwk_cates 内容分类）。清单中 audio.path 相对于本版本目录。不分
      train/dev/test。
    sources:
    - amphion-audio-backup-1373259071:opendatalab-multilingual/（computer-2/ 的 57 个 tar 分片，含 ar、hu、ru、cs 和部分 ko；sha256 与 computer-2-index.json
      一致）
    - amphion-audio-backup-1373259071:computer-2/audio/{ko,sr,th,vi}.tar（ko 完整版及 sr、th、vi）
    merge_notes: 两处为同一份数据的不同部分：computer-2/ 中现存的 ru、cs 原始文件全部包含在分片中，未重复下载；分片中的部分 ko（101,976 个文件）与 ko.tar 内容逐字节一致，只保留 ko.tar
      解压结果。本地统一为 <语种>/audio、<语种>/json_out 布局。
    limitations: ru 缺 88,880 条音频（见 ru split）。各语种 audio/ 下有少量上传中断留下的 .<名>.wav.tmp* 残片，不在清单中，读取时忽略；ar/json_out/cs-all.jsonl
      为 1 字节空文件，不是有效清单。
    downloaded_at: '2026-10-09'
