    description: >-
      替代 moss-transcribe-diarize-0.9B：同一批 m4a-128k 中文对话录音、同样的 30–120 秒窗口，两个版本不要一起用。
      MOSS Pro 质量抽检显示本地 0.9B 在 ≥4 个说话人的窗口上偏弱（好窗口 4 人约 74%、5 人及以上 51–60%），
      因此把上一版本保留窗口中本地标出 ≥4 人的 28,834 个 / 778.2 h 按窗口片段送 MOSS Pro（moss-transcribe-diarize-pro）重标，
      再过同样的整窗文字核对（Qwen3-ASR，CER ≤ 15%，不计重叠）和说话人检查（Emilia2 自带短句，split ≤ 0.2）：
      27,762 个 / 749.4 h 换成 Pro 标注；521 个 / 13.5 h 未通过而丢弃；551 个 / 15.3 h Pro 没有结果（多为安全策略拒绝），沿用本地标注。
      Pro 常把本地多出来的说话人合并：本地 4 人的窗口中 3,396 个 Pro 判为 3 人、411 个判为 2 人（听审确认过本地把同一人拆成多人的例子）。
      被并人检查标记的窗口（一个说话人覆盖两个及以上 Emilia2 原始说话人）导出时已经剔除，按最终标注重算，共 11,155 个 / 306.7 h
      （本地标注 8,813 个，与上一版本的排除名单一致；Pro 标注 2,342 个），训练不需要再排除。
      结果 209,816 条 / 5,483.6 h，其中 Pro 标注 25,420 条 / 682.6 h；上一版本排除并人窗口后是 210,726 条 / 5,508.2 h。
      记录里不区分标注来源，逐窗口的来源（labels_from）在运行目录 export/window-merge-v6/。
      音频引用解包后转成的 16 kHz 单声道 FLAC，记录按 cut_id + start/duration 引用，不需要 ffmpeg；
      约 11% 的记录窗口末尾超出 FLAC 末尾，最多 0.6 毫秒（上一版本同样）。
      已知局限：约 16.8% 的窗口只有一个说话人；有声剧、短剧中一人配多角时可能按角色拆成多个说话人；
      10 题听审中多人重叠处 Pro 并不比本地明显更好（两边都会漏标对方标出的重叠）。
      与 emilia2@tts-unified-v0.1 同源，可按 recording_id 对应；如需留验证/测试集，请两边一起排除。
    source: emilia2_zh_dialogue_diarize@moss-transcribe-diarize-0.9B
    source_dataset: emilia2
    annotation: moss-transcribe-diarize-0.9b+moss-transcribe-diarize-pro(windows-with-4+-local-speakers)+qwen3-asr-window-check(cer<=15)+emilia2-utterance-speaker-check(split<=0.2)+speaker-merge-excluded
