    description: >-
      Emilia2 中文多人对话（只取 zh、≥120 秒，源 78,994 条 / 8,097 h）的说话人日志伪标签。
      本地 MOSS-Transcribe-Diarize 0.9B 粗筛（≥2 人且每人 ≥5 秒，保留 6,112.6 h）并整条打说话人和文本；
      在停顿处切成 30–120 秒窗口，按窗口整体保留或丢弃：Qwen3-ASR 整窗识别，文字差异 ≤ 15%（不计重叠处）；
      再与 Emilia2 自带的带时间短句比对说话人，上游同一人被拆到其他编号的比例 ≤ 0.2。
      音频直接引用 emilia2@extracted-enzh-20261012 解包的 m4a（AAC 128 kbps、44.1 kHz 单声道，与打标所用的 tar 成员逐字节同大小），
      记录按 cut_id + start/duration 引用；读取需要 PATH 上有 ffmpeg（lhotse 的 audioread 后端），训练时重采样到 16 kHz。
      2026-10-12 起由原先自转的 16 kHz FLAC 改为引用解包 m4a，时间轴不变（抽查波形对齐误差 0 样本，53,965 条录音解码时长全部一致）。
      试跑 100 段以 MOSS Pro 为参照：保留窗口文字错误率约 3%，说话人混淆 0.86%。
      已知局限：约 16.8% 的窗口只有一个说话人；有声剧、短剧中一人配多角时 MOSS 可能按角色拆成多个说话人。
      与 emilia2@tts-unified-v0.1 同源，可按 recording_id 对应；如需留验证/测试集，请两边一起排除。
    source: /workspace/data/DATA-TTS/Emilia2/Emilia2_TTS_m4a/data
    source_dataset: emilia2
    annotation: moss-transcribe-diarize-0.9b+qwen3-asr-window-check(cer<=15)+emilia2-utterance-speaker-check(split<=0.2)
    window_rule: windows kept whole by the window text and speaker checks
    training_exclusions: >-
      exclude_records train_120s-speaker-merge-excluded-records.txt in this version directory
      (2026-10-15)：10,766 条 / 295.7 h，MOSS 的一个说话人覆盖了两个及以上 Emilia2 原始说话人
      （只用整条落在一个 MOSS 说话人上的原始短句判断）。听审 9 题中 7 题确为两人被并成一人，
      声纹（ERes2NetV2）分不开，故全部排除。排除后 210,726 条 / 5,508.2 h；各说话人数档丢 4.3–7.8%。
      原始短句只覆盖约 47% 的语音，没有短句覆盖处的并人查不到。
    audit: datasets/emilia2_zh_dialogue_diarize/versions/moss-transcribe-diarize-0.9B/audit.json
    audio_source: emilia2@extracted-enzh-20261012
    known_issues:
      - 读取 m4a 需要 ffmpeg；训练环境没有 ffmpeg 时 lhotse 报 AudioLoadingError（NoBackendError）
    superseded_by: emilia2_zh_dialogue_diarize@moss-transcribe-diarize-0.9B-pro4plus
    run_dir: /workspace/workspace/mingdong/data/amphiondata/emilia2-zh-dialogue-diarize-20261010
