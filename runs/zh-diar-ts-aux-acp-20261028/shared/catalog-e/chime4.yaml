      permission). WSJ0 audio and prompts are LDC93S6A and need an LDC license. The mirror is unofficial.
    description: CHiME-4 评测数据：WSJ0 句子在公交（BUS）、咖啡馆（CAF）、步行街（PED）、街道（STR）四种噪声环境下用 6 麦平板录制（real）或模拟（simu），英文
      16 kHz 单声道 16 bit。这里有 dev（dt05）和 eval（et05）的 1 通道、2 通道 track 音频与全部转写，共 5920 条、10.09 小时，每组 4 个说话人；常用 1 通道
      track 的 et05_real 报 WER。没有训练音频（tr05）、6 通道 track、背景噪声和 embedded 连续录音，这些属于完整 CHiME-3（LDC2017S24），公开渠道拿不到，只能评测。
    acquisition: Downloaded CHiME4.tar from hf-mirror.com (sha256 equals the Hugging Face LFS oid) and extracted it under extracted/.
      The 31 symlinks into the absent ../../CHiME3 tree (Manifest/CHiME3_*.txt and audio/16kHz/{backgrounds,embedded,enhanced,isolated,isolated_6ch_track})
      were not extracted. The tar also carries the WSJ0 si_tr_s/si_dt_05/si_et_05 .wv1 files and the Kaldi baseline models under
      tools/ASR_models.
    known_issues:
    - annotations/ has the 1ch/2ch track channel lists only for dt05; the et05 lists are not in this package.
    integrity: local_sha256_recorded
