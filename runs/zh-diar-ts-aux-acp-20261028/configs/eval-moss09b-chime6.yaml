# MOSS-Transcribe-Diarize 0.9B 在本轮同一面板上的基线（由 eval-step8000-chime6.yaml 生成，只换模型、服务、接口与输出格式；AmphionEval 0.10.0）。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/amphion-eval/bin/python}
  cwd: {path: ../../..}
  # AmphionEval 0.10.0（已发布，环境 amphion-eval）的 meeting 评测器；评测进程不 import 本项目。
  pythonpath: []
  gpus: []
  threads: {omp: 4, openblas: 1}
  environment:
    PYTHONUNBUFFERED: '1'
    AUDIO_DATA_CATALOG: /workspace/data/registry/catalog/meeting_selection_panel.yaml
    AUDIO_DATA_ROOTS_FILE: /workspace/workspace/mingdong/repo/open-audio-llm/runs/many-speaker-real-mix-acp-20261009/configs/roots.json
task:
  kind: eval
  backend: vllm
  server_url: http://127.0.0.1:8762
  module: amphion_eval.cli
  positional: [open-audio-llm, meeting]
  arguments:
    --model: {path: /workspace/model/MOSS-Transcribe-Diarize}
    --data_config: {path: data/chime6-dev.yaml}
    --split_group: evaluation
    --samples_per_source: 0
    --batch_size: 16
    --max_new_tokens: 4096
    --worker-timeout: 3600
    --server-url: http://127.0.0.1:8762
    --served-model: moss-transcribe-diarize
    --server-api: transcriptions
    --output-format: moss_transcribe_diarize
    --output_dir: {path: '{attempt}/artifacts/evaluation'}
recording:
  attempts_dir: {path: ../tasks/04-moss09b/chime6/attempts}
  result: {path: '{attempt}/artifacts/evaluation/summary.json'}
tracking:
  pythonpath: [{path: ../../../src}]
  enabled: true
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python}
  credentials_file: {path: /workspace/workspace/mingdong/.config/open-audio-llm/wandb-cluster.sh}
  entity: 1016097967-amphion
  project: open-audio-llm
  name: AmphionASR-zh-diar-restart-moss09b-chime6
  interval: 30
  startup_timeout: 180
  finish_timeout: 300
  metrics:
  - file: {path: '{attempt}/artifacts/evaluation/summary.json'}
    prefix: evaluation
