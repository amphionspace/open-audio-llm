# 【D 组 / 时间刻度】与 A 组只差输入格式：音频 token 之间每 5 秒插入一次已过秒数（“5”“10”…，普通数字 token，照 MOSS-Transcribe-Diarize 的 time_marker_every_seconds: 5），训练模板与 vLLM 服务用同一份代码 shared/code-tm（code-v17 + 时间刻度补丁，分支 feat/audio-time-markers），由 OPEN_AUDIO_LLM_AUDIO_TIME_MARKER_SECONDS 开启；数据（configs/train-data-a.yaml）、起点、步数、学习率与 A 组相同。用户 2026-10-28：“要不要参考moss的做法，加入时间刻度” → “可以”。
version: 1
runtime:
  python: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  cwd: /workspace/workspace/mingdong/repo/oal-diar-restart
  pythonpath:
  - /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/shared/code-tm/src
  - /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/shared/code-tm/audio-data-contract-src
  gpus:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  threads:
    omp: 2
    openblas: 1
  environment:
    TOKENIZERS_PARALLELISM: false
    HF_HUB_OFFLINE: '1'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    PYTHONUNBUFFERED: '1'
    PYTORCH_ALLOC_CONF: expandable_segments:True
    # Elapsed-second markers every 5 s inside the audio span (open_audio_llm.audio.time_markers); serve-d.yaml sets the same.
    OPEN_AUDIO_LLM_AUDIO_TIME_MARKER_SECONDS: '5'
    # lhotse decodes the Emilia2 dialogue m4a through ffmpeg on PATH (static 7.0.2, the build that verified the
    # m4a index); the conda env does not ship one. YAML values are literal, so the image defaults are listed too.
    PATH: /workspace/workspace/mingdong/.local-tools/ffmpeg-7.0.2-static/bin:/workspace/workspace/mingdong/miniconda3/envs/oal-train/bin:/usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  distributed:
    processes: 8
    port: 29787
data:
  config: /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/configs/train-data-a.yaml
task:
  kind: train
  module: open_audio_llm.integrations.ms_swift.train
  positional:
  - sft
  arguments:
    --model_type: amphion_asr_1.7b
    --tuner_type: full
    --freeze_vit: false
    --freeze_aligner: false
    --freeze_llm: false
    --torch_dtype: bfloat16
    --attn_impl: sdpa
    --max_length: 16384
    --per_device_train_batch_size: 2
    --per_device_eval_batch_size: 1
    # One node per round (user, 2026-10-12; the single-speaker round holds the other): 8 GPUs x 2 x 2
    # accumulation keeps the global batch of 32.
    --gradient_accumulation_steps: 2
    --learning_rate: 5.0e-06
    --vit_lr: 2.5e-06
    --aligner_lr: 5.0e-06
    --max_steps: 12000
    --lr_scheduler_type: cosine
    --warmup_ratio: 0.0
    --warmup_steps: 500
    --gradient_checkpointing: true
    --vit_gradient_checkpointing: true
    --ddp_find_unused_parameters: true
    --dataloader_num_workers: 4
    --dataloader_persistent_workers: true
    --performance_logging: true
    --save_steps: 1000
    --logging_steps: 5
    --report_to: none
    --seed: 42
    --audio_encoder_parallel: false
    --audio_encoder_batching: true
    --use_logits_to_keep: false
    --prediction_loss_only: true
    --optim: adamw_torch_fused
    --weight_decay: 0.01
    --max_grad_norm: 1.0
    --save_only_model: false
    --bf16: true
    --fp16: false
    # Evaluation runs on the development machine, so no rank waits for it. Attempt 001
    # hung 2 h after a worker rank failed while peers waited on a collective.
    --ddp_timeout: 1800
    --eval_strategy: 'no'
    --load_args: false
    --check_model: false
    --add_version: false
    # Starts from the Emilia2 round's selected step 6000 (its training checkpoint-6000 model files pulled from whai:open-audio-llm into /workspace/data/ae-runs; fresh optimizer).
    --model: /workspace/data/ae-runs/zh-emilia2-dialogue-6000/checkpoint-6000
    --external_plugins:
    - /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/shared/code-tm/src/open_audio_llm/integrations/ms_swift/register_qwen3_asr.py
    - /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/scripts/training_callbacks.py
    --output_dir:
      path: '{attempt}/artifacts/training'
    --continuous_training: false
    --gradient_checkpointing_kwargs:
      use_reentrant: false
    --callbacks:
    - many_speaker_training_audit
preflight:
- kind: prepare
  module: open_audio_llm.data.catalog_cache
  arguments:
    --data_config: /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/configs/train-data-a.yaml
    --workers: 4
    --batch-size: 2
    --world-size: 8
    --preflight-report:
      path: '{attempt}/artifacts/data-preflight.json'
recording:
  attempts_dir:
    path: ../tasks/02-train-d/attempts
tracking:
  pythonpath:
  - /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/shared/code-tm/src
  enabled: true
  python: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python
  credentials_file: /workspace/workspace/mingdong/.config/open-audio-llm/wandb-cluster.sh
  entity: 1016097967-amphion
  project: open-audio-llm
  name: AmphionASR-zh-diar-restart-d-time-markers-5s-from-emilia2-6k
  interval: 5
  startup_timeout: 180
  finish_timeout: 300
parameters:
  # Written by the development-machine selector (tasks/03-select); the ACP training directory
  # belongs to root and is not writable there. The directory exists before submission; the file must not.
  stop_request: /workspace/workspace/mingdong/repo/oal-diar-restart/runs/zh-diar-ts-aux-acp-20261028/tasks/03-select-d/control/stop-request.json
  stage_max_steps: 12000
  analysis_base_commit: b18268e
cluster:
  kind: acp
  sco_home: /workspace/workspace/mingdong/.local-tools/sco
  credentials: /workspace/workspace/mingdong/repo/open-audio-llm/third_party/amphionkeys/sensecore.env
  workspace: workspace-whai
  aec2: cluster-whai
  image: registry.cn-sh-01.sensecore.cn/ccr-wh/amphion-base:amphion-base-20260923072955
  worker_spec: N3lS.Ii.I60.94c944g
  nodes: 1
  priority: HIGHEST
  quota_type: reserved
  wait: true
  mounts:
  - 01a0c847-3d8d-7b42-8c75-50cbd189bb56:/workspace
  environment:
    NCCL_IB_TIMEOUT: 22
    NCCL_IB_RETRY_CNT: 13
    NCCL_IB_AR_THRESHOLD: 0
storage:
  executable: /workspace/workspace/mingdong/.local/share/amphion-bucket/cluster-venv/bin/ab
  remote: whai:open-audio-llm
  local_root: /workspace/workspace/mingdong/repo/oal-diar-restart
