# D 组（时间刻度）选模用的 vLLM HTTP 服务模板：与 serve-step8000.yaml 相同，只把插件代码换成 shared/code-tm 并开启每 5 秒时间刻度，与训练端构造同一音频段（scripts/check_time_markers*.py 在分支 feat/audio-time-markers 上核对过：缓存开/关两条路径都与训练逐 token 相同）。
# 原模板说明：起点 8000 步合并模型的 vLLM HTTP 服务（部署推理栈）。解码与编码器注意力沿用实验脚本的离线配置，便于一致性核对：
# BF16、TRITON_ATTN、eager、seed 42、max_model_len 12288、每批最多 16 条；编码器整段注意力（n_window_infer 26000 ≥ 最长 244 秒片段）。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python}
  cwd: {path: ../../..}
  # Placed first, so vLLM's open_audio_llm plugin entry point loads the time-marker code instead of the installed source.
  pythonpath: [{path: ../shared/code-tm/src}]
  gpus: [1]
  threads: {omp: 4, openblas: 1}
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    # 共享存储繁忙时加载权重可超过 vLLM 默认的 600 秒（2026-10-11 选模在 6000 步因此失败）；与外层 1800 秒启动超时一致。
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
    OPEN_AUDIO_LLM_AUDIO_TIME_MARKER_SECONDS: '5'
task:
  kind: serve
  backend: vllm
  model: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/unified-diarization-asr-20261001/tasks/merge-8000/attempts/001/artifacts/merged-model}
  arguments:
    --host: 127.0.0.1
    --port: 8761
    --served-model-name: step8000
    --dtype: bfloat16
    --max-model-len: 12288
    --max-num-seqs: 16
    --max-num-batched-tokens: 16384
    # 本机 GPU 与其他用户共享：固定占用约 24 GB，留出余量。
    --gpu-memory-utilization: 0.3
    --seed: 42
    --limit-mm-per-prompt: {audio: 1}
    --attention-config: {backend: TRITON_ATTN}
    --mm-encoder-attn-backend: TRITON_ATTN
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 26000
  flags: [--enforce-eager]
recording:
  attempts_dir: {path: ../tasks/03-serve/attempts}
