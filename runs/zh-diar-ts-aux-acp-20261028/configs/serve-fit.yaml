# 训练集拟合诊断用的起点模型服务；除端口、显存占比和卡号外与选模器的服务（configs/serve-step8000.yaml 模板）相同。
# 本机 8 张卡都被其他会话占用，空余最多约 20 GB，所以显存占比从 0.3 降到 0.22（约 17.6 GiB）；只影响能同时解码的条数，不影响输出。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/vllm-serving/bin/python}
  cwd: {path: ../../..}
  pythonpath: []
  gpus: [6]
  threads: {omp: 4, openblas: 1}
  environment:
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_ENGINE_READY_TIMEOUT_S: '1800'
    PYTHONUNBUFFERED: '1'
task:
  kind: serve
  backend: vllm
  model: {path: /workspace/data/ae-runs/zh-emilia2-dialogue-6000/checkpoint-6000}
  arguments:
    --host: 127.0.0.1
    --port: 9031
    --served-model-name: step6000
    --dtype: bfloat16
    --max-model-len: 12288
    --max-num-seqs: 16
    --max-num-batched-tokens: 16384
    --gpu-memory-utilization: 0.22
    --seed: 42
    --limit-mm-per-prompt: {audio: 1}
    --attention-config: {backend: TRITON_ATTN}
    --mm-encoder-attn-backend: TRITON_ATTN
    --hf-overrides:
      thinker_config:
        audio_config:
          n_window_infer: 26000
  flags: [--enforce-eager]
recording:
  attempts_dir: {path: ../tasks/05-train-fit/serve/attempts}
