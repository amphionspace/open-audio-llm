version: 1
name: tsasr-latency-20261031
purpose: 提升 NVIDIA 线上（Focus）TS-ASR 的出字速度：按 audiollm-go main 的预览/final 节奏回放，量化各手段（suffix 投机解码、FP8、缩短指令）的延迟收益与准确率代价
policy:
  evaluation_backend: vllm
  human_review_required: false
inputs:
  model: /workspace/data/packages/amphionasr-1.7b-v3-tsrobust-054avg3
tasks:
- {id: stream-bench, name: 流式回放测延迟与吞吐, config: configs/stream-bench.yaml, depends_on: []}
- {id: runtime-levers, name: runtime 侧 final 时机与窗口复用, config: configs/runtime-levers.yaml, depends_on: []}
- {id: prefill-bench, name: prefill 微基准：指令长度与预处理, config: configs/prefill-bench.yaml, depends_on: []}
- {id: profile-prefill, name: prefill 剖析：音频侧开销来源, config: configs/profile-prefill.yaml, depends_on: []}
- {id: nosync-ab, name: 编码器去 GPU 同步 A/B, config: configs/nosync-ab.yaml, depends_on: []}
- {id: fp8-h20-emu, name: H20 数值的 FP8 量化损失（A800 模拟）, config: configs/fp8emu/serve-tsasr.yaml, depends_on: []}
