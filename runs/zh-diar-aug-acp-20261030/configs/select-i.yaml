# 开发机异步选模与结束评测（面板与判定沿用 zh-nosimilar-control-acp-20261016 / zh-similar-voice-acp-20261014：目标中文真实会议，单人 ASR 只作保持门槛）。第二轮 I 组（增强 + 真实会议权重缩到三分之一）。新增 train_fit 面板（训过数据的固定集，只报告不判定）和 fit_gaps（没训过的 AliMeeting dev 减训过的 AliMeeting 窗口）。
# 每个保存点复制权重到本执行（缺失时从对象存储拉回），用 open-audio-llm serve（vLLM HTTP）起服务，
# 由 AmphionEval 0.10.0（ae open-audio-llm meeting，环境 amphion-eval）评测选模面板。
version: 1
runtime:
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python}
  cwd: {path: ../../..}
  pythonpath: [{path: ../shared/code/src}]
  gpus: []
  threads: {omp: 2, openblas: 1}
  environment:
    PYTHONUNBUFFERED: '1'
    # 10-30 21:30 UTC 起 api.wandb.ai 对本机出口 IP 返回 Cloud Armor 403（attempt 001 的评测因此在
    # wandb.init 退出），换海外出口立刻 200，证据见 tracking/wandb-egress-probe.txt。这两个变量只让
    # W&B 流量走本地中转端口，权重和对象存储（whai 的 *.sensecoreapi-oss.cn）仍走直连。
    WANDB_HTTP_PROXY: http://127.0.0.1:17910
    WANDB_HTTPS_PROXY: http://127.0.0.1:17910
task:
  kind: prepare
  script: {path: ../scripts/select_checkpoints.py}
  accepts_config: true
  arguments: {}
parameters:
  output: {path: '{attempt}/artifacts'}
  tracking_prefix: AmphionASR-zh-diar-r2-i-select
  # Round 1 arm A's step-0 measurement of the same start model, plus its train_fit values on the same windows
  # (shared/baseline-step0.json, written from round 1's tasks/05-train-fit).
  baseline: {path: ../shared/baseline-step0.json}
  # 10-30 21:37–21:53 UTC：attempt 001 在 wandb.init 收到 api.wandb.ai 的 403（整台机器都打不通该接口）后退出，
  # 已评的保存点和基线仍然有效，attempt 002 从这里续上（权重会重新取）。
  previous_state: {path: ../tasks/03-select-i/attempts/001/artifacts}
  base_model: {path: /workspace/data/ae-runs/zh-emilia2-dialogue-6000/checkpoint-6000}
  training_attempts:
  - {path: ../tasks/02-train-i/attempts/001}
  interval: 1000
  max_steps: 12000
  poll_seconds: 60
  # One GPU per checkpoint; shared machine: pick by nvidia-smi before launching, never GPU 0 (2026-10-15: GPU 3 had 75 GB free, then only 18 GB at step 7000 and vLLM failed; GPU 2 was empty).
  gpus: [3]
  port_base: 9051
  # Card picked at each server start (scripts/select_checkpoints.py pick_gpu, under the eval scripts' GPU lock): the one
  # with the most free memory among gpu_pool, once it has gpu_free_mib (0.3 of 80 GB plus margin); never 0 (see above)
  # nor 5 (another session's server). `gpus` above only sets the parallel slots and their ports.
  gpu_pool: [1, 2, 3, 4, 6, 7]
  gpu_free_mib: 26000
  server_startup_timeout: 1800
  readable_timeout: 1800
  serve_template: {path: serve-step8000.yaml}
  delete_request_audio: true
  stop_request: {path: ../tasks/03-select-i/control/stop-request.json}
  storage:
    executable: /workspace/workspace/mingdong/.local/share/amphion-bucket/cluster-venv/bin/ab
    remote: whai:open-audio-llm
    local_root: /workspace/workspace/mingdong/repo/oal-diar-restart
  panels:
    selection: {template: {path: eval-step8000-panel.yaml}}
    many_speaker: {template: {path: eval-step8000-many70.yaml}}
    # Single-speaker ASR dev sets in the plain request format (1000 fixed samples per source).
    asr: {template: {path: eval-asr-dev.yaml}}
    # Fixed set of trained real-meeting windows (data/train-fit-set.yaml): shows memorization next to the unseen dev set.
    train_fit: {template: {path: eval-train-fit.yaml}}
  report_panels: [train_fit]
  fit_gaps:
    alimeeting:
      unseen: {panel: selection, label: alimeeting_dev, field: cp_error_rate_without_loops}
      trained: {panel: train_fit, label: alimeeting_train, field: cp_error_rate_without_loops}
  # Real Chinese meetings are what this data should move (AliMeeting dev, loop-excluded cpER; it moved
  # <0.5 point between reruns of one checkpoint).
  target: {panel: selection, label: alimeeting_dev, field: cp_error_rate_without_loops}
  # Reported, not gated: error rate of reference turns overlapping another speaker, windows whose output repeats
  # lines across speakers (not caught by the loop rule), the text / speaker-attribution split after speaker
  # alignment, attribution on the most similar-voice third of windows (the gap this data targets) and the share of
  # turns starting more than 1 s off.
  turn_diagnostics:
    selection: [alimeeting_dev]
  # Per window: cosine similarity of the two most similar reference speakers (ERes2NetV2), 135 of 138 windows
  # (/workspace/workspace/mingdong/data/model-compare-review-20261014/speaker-similarity.json).
  voice_similarity:
    alimeeting_dev: {path: ../shared/alimeeting-dev-voice-similarity.json}
  # Guards against the start model: the 6-12 speaker cpER moved 3-11 points between neighbouring
  # checkpoints of the dialogue round (0.29-0.40), hence 5; single-speaker ASR is a floor only
  # (user, 2026-10-12: not a target), 1 point each on the plain-format dev sets.
  retention:
    many_speaker: {panel: many_speaker, group: many_speaker, tolerance: 0.05}
    wenetspeech_dev: {panel: asr, source: 'wenetspeech@icefall-20260908:dev', tolerance: 0.01}
    kespeech_dev: {panel: asr, source: 'kespeech@icefall-20260908:dev', tolerance: 0.01}
  # decode-loop-study-20261009: three default reruns gave loop counts with SD 2.5-3.1.
  loops: {max_increase: 6, stop: false}
  # Checkpoints are 1000 steps apart this round (2000 before): three in a row cover the same span.
  patience: 3
  final_panels:
    meeting180: {template: {path: eval-step8000-meeting180.yaml}}
    chime6: {template: {path: eval-step8000-chime6.yaml}}
    fixed338: {template: {path: eval-step8000-fixed.yaml}}
    aishell5_dev: {template: {path: eval-final-aishell5-dev.yaml}}
    cs_dialogue_test: {template: {path: eval-final-cs-dialogue-test.yaml}}
  # The start model's final panels, measured by the Emilia2 round's selector with the same templates and data.
  final_baseline:
    meeting180: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-emilia2-dialogue-acp-20261012/tasks/03-select/attempts/004/artifacts/final/checkpoints/step-6000/meeting180/attempts/001/artifacts/evaluation/summary.json}
    chime6: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-emilia2-dialogue-acp-20261012/tasks/03-select/attempts/004/artifacts/final/checkpoints/step-6000/chime6/attempts/001/artifacts/evaluation/summary.json}
    fixed338: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-emilia2-dialogue-acp-20261012/tasks/03-select/attempts/004/artifacts/final/checkpoints/step-6000/fixed338/attempts/001/artifacts/evaluation/summary.json}
    aishell5_dev: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-emilia2-dialogue-acp-20261012/tasks/03-select/attempts/004/artifacts/final/checkpoints/step-6000/aishell5_dev/attempts/001/artifacts/evaluation/summary.json}
    cs_dialogue_test: {path: /workspace/workspace/mingdong/repo/open-audio-llm/runs/zh-emilia2-dialogue-acp-20261012/tasks/03-select/attempts/004/artifacts/final/checkpoints/step-6000/cs_dialogue_test/attempts/001/artifacts/evaluation/summary.json}
  final_tolerance: 0.01
recording:
  attempts_dir: {path: ../tasks/03-select-i/attempts}
  result: {path: '{attempt}/artifacts/final-results.json'}
tracking:
  pythonpath: [{path: ../shared/code/src}]
  enabled: true
  python: {path: /workspace/workspace/mingdong/miniconda3/envs/oal-train/bin/python}
  credentials_file: {path: /workspace/workspace/mingdong/.config/open-audio-llm/wandb-cluster.sh}
  entity: 1016097967-amphion
  project: open-audio-llm
  name: AmphionASR-zh-diar-r2-i-select
  interval: 30
  startup_timeout: 180
  finish_timeout: 300
  metrics:
  - file: {path: '{attempt}/artifacts/selection-decision.json'}
    prefix: selection
