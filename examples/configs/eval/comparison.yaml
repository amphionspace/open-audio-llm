version: 1
runtime:
  # AmphionEval environment: pip install 'amphion-eval[legacy-http,tracking]' from the GitLab package registry.
  python: python
  cwd: {path: ../../..}
  # Empty on purpose: the evaluator must not import open-audio-llm.
  pythonpath: []
  gpus: []
  threads: {omp: 4, openblas: 1}
task:
  kind: eval
  backend: vllm
  server_url: http://127.0.0.1:8009
  module: amphion_eval.cli
  positional: [open-audio-llm, vllm]
  arguments:
    --port: 8009
    --model: amphionasr-1.7b
    --test-plan-file: {path: ../eval/plans/ts-hotwords.yaml}
    --output-dir: {path: '{attempt}/artifacts'}
    --manifest-dir: {path: /ai_sds_wuzz/DATA_ASR/LHOTSE}
    --ser-manifest-dir: {path: /ai_sds_wuzz/DATA_SER/LHOTSE}
    --tsasr-test-manifest-dir: {path: /chenmingjie/mingdong/data/lhotse/ts_hw_test}
    -j: 64
    --default-lang: zh-cn
    --hotwords-pad-to: 10
    --hotword-mode: none
    --retrieve-top-k: 10
    --retrieve-workers: 8
    --prompt-style: qwen3_asr
    --backend: auto
    --encoder-source: vllm
    --triton-url: localhost:8000
    --triton-model: rag_asr_retrieve
    --triton-top-k: 0
    --run-name: comparison
storage:
  # Uploads through AmphionBucket; the remote layout mirrors paths under local_root.
  executable: {path: ~/.local/bin/ab}
  remote: whai:open-audio-llm
  local_root: {path: ../../..}
recording:
  attempts_dir: {path: ../../../runs/vllm-comparison/tasks/evaluate/attempts}
  result: {path: '{attempt}/artifacts/comparison/summary.json'}
tracking:
  pythonpath: [{path: ../../../src}]
  enabled: true
  python: python
  credentials_file: {path: ~/.bashrc}
  entity: 1016097967-amphion
  project: open-audio-llm
  name: vllm-comparison
  metrics:
    - file: {path: '{attempt}/artifacts/comparison/summary.json'}
      prefix: evaluation
