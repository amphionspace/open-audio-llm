# 每次都带热词列表。列表就是 v3 离线配好的真热词 + 干扰词（约 30 个），原样使用：
# max_hotwords: 0 表示不再从热词池补干扰词，标注词也不随机丢掉。
hotwords:
  max_hotwords: 0
  hotword_prompt_prob: 1.0
  hotword_miss_prob: 0.0

# 条数和 480 秒同时生效：再加一条会超过 480 秒时，不满 14 条也封批。
# 目标说话人只算混合音时长，注册音不计入。14 条为 bf16 + DeepSpeed 下实测：最坏批次
# （14 条 30 秒混合音 + 5 分钟注册）峰值 30.5 GiB，见 runs/longenroll-v5-dev-20261016 的 02-speed。
batching:
  max_duration: 480
  max_samples: 14
  num_buckets: 30
  buffer_size: 2000
  drop_last: false

# 普通混响和远场冲激响应互斥，各 25%；其余不加混响。加噪 50%，信噪比 5–20 dB。
# 加噪时 wham 占 30%，其余四个噪声源各占 17.5%。混响源仍等概率。
# 三份 farfield_speech_noise 已经是远场人声，混入时不再卷积。wham、musan 保持干声。
augmentation:
  rir_prob: 0.25
  far_rir_prob: 0.25
  noise_prob: 0.5
  noise_snr_db: [5.0, 20.0]

noise_sources:
  - dataset_id: wham
    version: tr-20261014
    split: train
    weight: 30
  - dataset_id: musan
    version: legacy-20260804
    split: noise
    weight: 17.5
  - dataset_id: farfield_speech_noise_1spk
    version: "20261014"
    split: train
    weight: 17.5
  - dataset_id: farfield_speech_noise_2spk
    version: "20261014"
    split: train
    weight: 17.5
  - dataset_id: farfield_speech_noise_3spk
    version: "20261014"
    split: train
    weight: 17.5

rir_sources:
  - dataset_id: real_rir_slr28
    version: prepared-20260908
    split: all
  - dataset_id: sim_rir_slr26
    version: legacy-20260804
    split: all
  - dataset_id: sim_rir_slr28
    version: legacy-20260804
    split: all

