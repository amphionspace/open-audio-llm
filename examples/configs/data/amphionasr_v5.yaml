# 长注册目标说话人配方。混合音、普通 ASR、热词与 v4 相同，目标说话人的注册重选为 1 秒～5 分钟，
# 规则见 docs/guides/amphionasr-v5-data.md。一个 epoch 约 10.84 万小时（只计待识别音频）：
# 普通 ASR 3.33 万小时（30.7%），热词 ASR 0.96 万小时（8.9%），目标说话人 6.55 万小时（60.5%）。
# 注册音另有 22.8 万小时，不计入上面的小时数，也不计入组批时长。
# Emilia2 三个训练集整集进入。LibriMix、AISHELLMix 的四个 train 划分各一整遍；
# LibriMix 注册不足 1 秒的 4 条由 exclude_records 排除。
# hw_sft 只用 train_hotwords（系统提示带 Hotwords: 的 834336 条），重复 8 遍。
# 热词提示与 v3 相同：用记录里离线配好的列表（真热词 + 干扰词，原顺序），不丢词也不再补干扰词。
# AudioRecord 的任务写在记录上。Lhotse 来源的 task 在这里指定。
# catalog/replay 里 GigaSpeech、LibriSpeech、Common Voice、KeSpeech、AISHELL-2、FLEURS
# 的 manifest 通过 legacy_asr、multilingual 指到本地副本。录音路径写在 manifest 里。
