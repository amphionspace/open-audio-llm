# Dev only. Test splits stay out of this file. AliMeeting's four durations
# cover the same meetings, so those hours are not additive. Dialog enroll is a
# subset of the plain clips; long has no enrollment split.
validation:
  - &eval_plain
    dataset_id: target_sot_eval
    version: "20261001"
    split: alimeeting_dev_30s_plain
  - <<: *eval_plain
    split: alimeeting_dev_120s_plain
  - <<: *eval_plain
    split: alimeeting_dev_300s_plain
  - <<: *eval_plain
    split: alimeeting_dev_600s_plain
  - &emilia_plain
    dataset_id: target_sot_eval
    version: "20261004"
    split: dialog_zh_dev_2to5_plain
  - <<: *emilia_plain
    split: dialog_zh_dev_6plus_plain
  - <<: *emilia_plain
    split: dialog_en_dev_2to5_plain
  - <<: *emilia_plain
    split: dialog_en_dev_6plus_plain
  - <<: *emilia_plain
    split: long_zh_dev_plain
  - <<: *emilia_plain
    split: long_en_dev_plain
  - &eval_enroll
    dataset_id: target_sot_eval
    version: "20261001"
    split: alimeeting_dev_30s_enroll
    enrollment:
      probability: 1.0
      min_seconds: 1.0
      max_seconds: 5.0
      max_targets: 5
      absent_probability: 0.0
      mode: all
  - <<: *eval_enroll
    split: alimeeting_dev_120s_enroll
  - <<: *eval_enroll
    split: alimeeting_dev_300s_enroll
  - <<: *eval_enroll
    split: alimeeting_dev_600s_enroll
  - &emilia_enroll
    dataset_id: target_sot_eval
    version: "20261004"
    split: dialog_zh_dev_2to5_enroll
    enrollment:
      probability: 1.0
      min_seconds: 1.0
      max_seconds: 5.0
      max_targets: 5
      absent_probability: 0.0
      mode: all
  - <<: *emilia_enroll
    split: dialog_zh_dev_6plus_enroll
  - <<: *emilia_enroll
    split: dialog_en_dev_2to5_enroll
  - <<: *emilia_enroll
    split: dialog_en_dev_6plus_enroll
batching:
  max_duration: 800
  max_samples: 8
  num_buckets: 8
  buffer_size: 2048
  batch_merge: 1
  merge_window: 1
  drop_last: false
augmentation:
  speed_prob: 0
  rir_prob: 0
  noise_prob: 0
  spec_aug_prob: 0
  frequency_mask_width: 8
  time_mask_width: 20
