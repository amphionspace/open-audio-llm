# SpeakerVAD handles absent-target rejection; TS uses enrolled-speaker overlap positives.
# Use clean training versions where available; other sources remain usable.
# Only the three clean ASR sources require clean.pass=true; evaluation labels stay fixed.
augmentation:
  frequency_mask_width: 8
  spec_aug_prob: 0.15
  speed_factors:
  - 0.9
  - 1.0
  - 1.1
  speed_prob: 0.25
  time_mask_width: 20
batching:
  batch_merge: 2
  drop_last: false
  max_duration: 120
  max_samples: 8
  merge_window: 4
  num_buckets: 4
evaluation:
- dataset_id: aishell
  max_duration: 20
  split: test
  task: asr
  version: icefall-20260908
- dataset_id: aishell2
  max_duration: 20
  split: test
  task: asr
  version: icefall-20260908
- dataset_id: kespeech
