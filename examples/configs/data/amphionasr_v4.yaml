    reps: 2

# 只做 loss 监视。test 不进这里。
# 全量 357106 条。8 卡、每卡 4 条时前向大约 0.2 秒一步，一轮要约 40 分钟。
# 按各来源条数比例抽 54000 条，种子用上面的 seed，每轮同一批。
# 单卡 12 进程读这批数据：对话大约 0.40 秒一步，其余被 0.2 秒的前向卡住，
# 8 卡一轮大约 7 分钟。超过 120 秒的片段加上转写会超过 max_length=2048，不进入验证。
validation_samples: 54000
validation_max_duration: 120
