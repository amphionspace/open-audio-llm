# 每次都带热词列表，标注词不随机丢掉。干扰词仍补到 max_hotwords。
hotwords:
  max_hotwords: 30
  hotword_prompt_prob: 1.0
  hotword_miss_prob: 0.0

# 条数和 480 秒同时生效：再加一条会超过 480 秒时，不满 12 条也封批。
batching:
  max_duration: 480
  max_samples: 12
  num_buckets: 30
  buffer_size: 2000
  drop_last: false

# 普通混响和远场冲激响应互斥，各 25%；其余不加混响。加噪 50%，信噪比 5–20 dB。
# 加噪时 wham 占 30%，其余四个噪声源各占 17.5%。混响源仍等概率。
# 三份 farfield_speech_noise 已经是远场人声，混入时不再卷积。wham、musan 保持干声。
augmentation:
  rir_prob: 0.25
  far_rir_prob: 0.25
  noise_prob: 0.5
  noise_snr_db: [5.0, 20.0]

noise_sources:
  - dataset_id: wham
    version: tr-20261014
    split: train
    weight: 30
  - dataset_id: musan
    version: legacy-20260804
    split: noise
    weight: 17.5
  - dataset_id: farfield_speech_noise_1spk
    version: "20261014"
    split: train
    weight: 17.5
  - dataset_id: farfield_speech_noise_2spk
    version: "20261014"
    split: train
    weight: 17.5
  - dataset_id: farfield_speech_noise_3spk
    version: "20261014"
    split: train
    weight: 17.5

rir_sources:
  - dataset_id: real_rir_slr28
    version: prepared-20260908
    split: all
  - dataset_id: sim_rir_slr26
    version: legacy-20260804
    split: all
  - dataset_id: sim_rir_slr28
    version: legacy-20260804
    split: all

