# Native Qwen3-ASR: bilingual hotword adaptation; see README.md for parameters.
seed: 42
sampling_rate: 16000

train:
  # 暂无适用的 clean 热词训练版本，继续使用现有派生训练集。
  - dataset_id: commonvoice_en_hotwords
    version: hotwords-v1-20260805
    split: train
    task: asr_hotwords
    min_duration: 0.5
    max_duration: 20.0
    samples: 10000

  - dataset_id: aishell_hotwords
    version: hotwords-v1-20260805
    split: train
    task: asr_hotwords
    min_duration: 0.5
    max_duration: 20.0
    samples: 10000

# Development data is used for loss monitoring, never the final test split.
validation:
  - dataset_id: librispeech
    version: icefall-20260908
    split: dev
    task: asr
    max_duration: 20.0
    max_samples: 64

  - dataset_id: aishell
    version: icefall-20260908
    split: dev
    task: asr
    max_duration: 20.0
    max_samples: 64

batching:
  max_duration: 120.0
  max_samples: 8
  num_buckets: 20
  buffer_size: 2000
  drop_last: false

# Drop all context on 20% of examples; randomly omit 10% of annotated words.
hotwords:
  max_hotwords: 20
  hotword_prompt_prob: 0.8
  hotword_miss_prob: 0.1

augmentation:
  speed_prob: 0.5
  speed_factors: [0.9, 1.0, 1.1]
  spec_aug_prob: 0.3
  time_mask_width: 20
  frequency_mask_width: 8

# Used only by the native evaluation command; never passed to the trainer.
evaluation:
  - dataset_id: commonvoice_en_hotwords
    version: hotwords-v1-20260805
    split: test
    task: asr_hotwords
    min_duration: 0.5
    max_duration: 20.0

  - dataset_id: aishell_hotwords
    version: hotwords-v1-20260805
    split: test
    task: asr_hotwords
    min_duration: 0.5
    max_duration: 20.0
catalog: ../../../../audio-data-contract/catalog
roots: ../../../../audio-data-contract/roots.json
metadata_cache: ../../../runs/catalog-metadata-cache
