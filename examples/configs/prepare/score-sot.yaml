version: 1
runtime:
  # AmphionEval environment: pip install 'amphion-eval[legacy-http,tracking]' from the GitLab package registry.
  python: python
  cwd: {path: ../../..}
  # Empty on purpose: the evaluator must not import open-audio-llm.
  pythonpath: []
  gpus: []
task:
  kind: prepare
  module: amphion_eval.cli
  positional: [open-audio-llm, rescore-sot]
  arguments:
    --predictions: {path: ../../../runs/sot-evaluation/predictions.jsonl}
    --output: {path: '{attempt}/artifacts/speaker-attribution.json'}
recording:
  attempts_dir: {path: ../../../runs/sot-scoring/tasks/score/attempts}
