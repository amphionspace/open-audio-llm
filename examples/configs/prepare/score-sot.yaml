version: 1
runtime:
  # Interpreter of the AmphionEval environment: pip install -e '../amphion-eval[legacy-http,tracking]'.
  python: python
  cwd: {path: ../../..}
  pythonpath: [{path: ../../../src}]
  gpus: []
task:
  kind: prepare
  module: amphion_eval.cli
  positional: [open-audio-llm, rescore-sot]
  arguments:
    --predictions: {path: ../../../runs/sot-evaluation/predictions.jsonl}
    --output: {path: '{attempt}/artifacts/speaker-attribution.json'}
recording:
  attempts_dir: {path: ../../../runs/sot-scoring/tasks/score/attempts}
