[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-audio-llm"
version = "0.1.0"
description = "Open Audio-LLM framework for composable audio towers, connectors, and causal LMs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers>=4.45",
  "numpy",
]

[project.optional-dependencies]
hf = ["safetensors", "soundfile", "librosa", "torchaudio"]
swift = ["ms-swift>=4.0", "deepspeed", "ujson", "pypinyin"]
vllm = ["vllm==0.17.0", "soundfile", "tritonclient[http]"]
vllm-serving = [
  "vllm[audio]==0.18.0",
  "soundfile==0.12.1",
  "tritonclient[http]==2.70.0",
]
data = ["audio-data-contract>=0.1.0", "PyYAML>=6", "lhotse", "soundfile", "torchaudio", "scipy"]
dev = ["pytest", "ruff"]
legacy-zipformer = []

[project.scripts]
open-audio-llm-convert-legacy = "open_audio_llm.scripts.convert_to_hf:main"

[project.entry-points."vllm.general_plugins"]
open_audio_llm = "open_audio_llm.integrations.vllm.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
