# Concrete default generated from examples/configs/deploy/vllm.yaml.
name: open-audio-llm-serving
services:
  vllm-serving:
    image: open-audio-llm/vllm-serving:local
    build:
      context: .
      dockerfile: docker/Dockerfile.vllm-serving
    gpus: all
    ipc: host
    shm_size: 16g
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports: ['8009:8009']
    volumes:
      - type: bind
        source: ./models/qwen3-asr-1.7b
        target: /models/main
        read_only: true
      - type: bind
        source: ./examples/configs/serve/container.yaml
        target: /configs/serve.yaml
        read_only: true
    command: [--config, /configs/serve.yaml]
