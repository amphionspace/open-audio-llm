name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push to the same PR makes the running check obsolete.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # setup-uv keeps its download cache; a fresh venv installs in seconds.
      - run: |
          uv venv --python "${{ steps.python.outputs.python-path }}" .venv
          # CPU wheels keep the CUDA libraries (several GB) out of the runner.
          uv pip install --torch-backend cpu -r requirements-ci.txt

      - run: .venv/bin/python -m pytest -q -rs tests
        env:
          PYTHONPATH: src
