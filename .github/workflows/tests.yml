name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push to the same PR makes the running check obsolete.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # The whole environment is restored on a hit; it changes only with the pins.
      # The venv links to the toolcache interpreter, so the key carries its version.
      - id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-ci.txt') }}

      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          uv venv --python "${{ steps.python.outputs.python-path }}" .venv
          # CPU wheels keep the CUDA libraries (several GB) out of the runner.
          uv pip install --torch-backend cpu -r requirements-ci.txt

      - run: .venv/bin/python -m pytest -q -rs tests
        env:
          PYTHONPATH: src
